<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Питомцы — поиск и шансы пола</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body{margin:0;background:#0f1115;padding:12px}
    .pdxWrap{
        max-width: 1060px;
        margin: 0 auto;
        position: relative;
        color:#fff;
        font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;
    }

    .pdxGlobalTop{
        display:grid;
        gap:10px;
        margin-bottom:10px;
    }

    .pdxSearchRow{
      display:flex;
      gap:8px;
      align-items:center;
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:10px;
      background:rgba(0,0,0,.25);
    }
    .pdxSearchRow input{
      flex:1;
      min-width:0;
      border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);
      color:#fff;
      border-radius:10px;
      padding:10px 12px;
      font-weight:700;
    }
    .pdxSearchBtn{
      border:1px solid rgba(255,255,255,.24);
      background:linear-gradient(180deg,#00d07a,#00b56a);
      color:#05150e;
      border-radius:10px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
    }

    .pdxGenderCard{
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:10px;
      background:rgba(0,0,0,.25);
    }
    .genderTop{display:flex;justify-content:space-between;font-weight:900;font-size:12px;margin-bottom:6px;gap:8px}
    .genderBar{
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.1);
      overflow:hidden;
      display:flex;
    }
    .genderMale{background:linear-gradient(90deg,#43b2ff,#2d8fe9);height:100%}
    .genderFemale{background:linear-gradient(90deg,#ff80bf,#f05ca6);height:100%}

    .pdxWrap input[type="radio"]{ position:absolute; opacity:0; pointer-events:none; }
    .pdxScreen{
        display:none;
        position:relative;
        border-radius:16px;
        overflow:hidden;
        border: 1px solid rgba(255,255,255,.14);
        background: rgba(255,255,255,.03);
        height: 680px;
        min-height: 520px;
        max-height: 86svh;
    }
    @supports (height: 1svh){ .pdxScreen{ height: min(680px, 86svh); } }

    .pdxBg{ position:absolute; inset:0; width:100%; height:100%; object-fit: cover; display:block; transform: translateZ(0); }
    .pdxVeil{ position:absolute; inset:0; background: radial-gradient(60% 60% at 50% 45%, rgba(0,0,0,.10) 0%, rgba(0,0,0,.36) 78%, rgba(0,0,0,.50) 100%); pointer-events:none; }
    .pdxContent{ position:absolute; inset:0; display:grid; grid-template-columns: 1.2fr .8fr; gap: 12px; padding: 14px; min-height: 0; }

    .pdxStage{ position:relative; border-radius:14px; border:1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.10); overflow:hidden; min-height: 400px; }
    .pdxStage::after{ content:""; position:absolute; inset:0; background: radial-gradient(40% 35% at 50% 72%, rgba(0, 177, 208, 0.14) 0%, rgba(0,0,0,0) 70%); pointer-events:none; }

    .pdxPet{ position:absolute; left:50%; top:52%; transform: translate(-50%,-50%); width: clamp(220px, 42vw, 360px); max-width: 86%; filter: drop-shadow(0 18px 34px rgba(0,0,0,.55)); user-select:none; pointer-events:none; animation: pdxFloat 2.8s ease-in-out infinite; }
    @keyframes pdxFloat{ 0%,100%{ transform: translate(-50%,-50%) translateY(0) scale(1); } 50%{ transform: translate(-50%,-50%) translateY(-10px) scale(1.01); } }

    .pdxStageNav{ position:absolute; left: 12px; right: 12px; bottom: 12px; display:flex; gap: 12px; z-index: 5; pointer-events:auto; }
    .pdxStageBtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:10px; padding: 14px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color:#fff; font-weight:950; font-size: 15px; user-select:none; cursor:pointer; touch-action: manipulation; }
    .pdxStageBtn.primary{ background: linear-gradient(180deg,#00d07a,#00b56a); color:#06120d; border-color: transparent; }

    .pdxSide{ display:grid; gap: 10px; align-content:start; min-height: 0; }
    .pdxCard{ border-radius:14px; border:1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.26); backdrop-filter: blur(2px); padding: 10px; }
    .pdxHeader{ display:flex; justify-content:space-between; align-items:baseline; gap: 10px; margin-bottom: 8px; }
    .pdxName{ font-weight: 950; font-size: 15px; line-height: 1.15; }
    .pdxId{ font-weight: 950; opacity:.85; font-size: 12px; padding: 5px 9px; border-radius: 999px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); white-space:nowrap; }
    .pdxDesc{ margin: 0; font-weight: 650; font-size: 12.5px; opacity:.95; line-height: 1.3; }

    .statsGrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    .stat{ border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); padding: 7px 9px; display:grid; gap: 6px; }
    .statTop{ display:flex; justify-content:space-between; align-items:center; font-weight:950; font-size: 12px; }
    .bar{ height: 7px; border-radius: 999px; background: rgba(255,255,255,.10); overflow:hidden; }
    .fill{ height:100%; width: var(--w, 0%); border-radius: 999px; background: linear-gradient(90deg, #00d07a, #00b56a); }
    .muted{ opacity:.85; font-weight:900; }

    .skill{ border-radius:12px; border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); padding: 9px; display:grid; gap: 7px; margin-bottom: 8px; }
    .skill:last-child{ margin-bottom:0; }
    .skillTitle{ font-weight: 950; font-size: 12px; display:flex; align-items:center; justify-content:space-between; gap: 10px; }
    .skillLeft{ display:flex; align-items:center; gap: 8px; min-width: 0; }
    .skillBadge{ padding: 3px 7px; border-radius: 999px; border:1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.22); font-weight: 950; font-size: 11px; white-space:nowrap; }
    .skillIcons{ display:flex; gap: 6px; align-items:center; flex: 0 0 auto; }
    .skillIcons img{ width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .skillText{ font-weight:650; font-size: 12.5px; line-height:1.3; opacity:.95; max-height: 78px; overflow:auto; padding-right: 6px; }

    .pdxScreen:has(input[type="radio"]:checked) { display: block; }

    .pdxEmpty{padding:20px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(0,0,0,.25);font-weight:800;text-align:center}

    @media (max-width: 900px){
        .pdxScreen{ border-radius:14px; height: auto; min-height: 0; max-height: none; }
        .pdxContent{ position:relative; inset:auto; grid-template-columns: 1fr; padding: 12px; }
        .pdxBg{ position:absolute; inset:0; height: 100%; min-height: 92svh; }
        .pdxStage{ min-height: 52svh; }
        .pdxPet{ top: 54%; width: clamp(220px, 68vw, 340px); max-width: 92%; }
        .pdxStageNav{ position: sticky; bottom: 10px; }
        .pdxStageBtn{ padding: 13px 10px; font-size: 14px; }
        .skillText{ max-height: 92px; }
    }
  </style>
</head>
<body>
<div class="pdxWrap">
    <div class="pdxGlobalTop">
      <div class="pdxSearchRow">
        <input id="petSearchInput" type="text" placeholder="Поиск по имени или ID">
        <button id="petSearchBtn" class="pdxSearchBtn">Найти</button>
      </div>
      <div class="pdxGenderCard">
        <div class="genderTop">
          <span>Частота появления в мире</span>
          <span id="genderSummary">М: 50% / Ж: 50%</span>
        </div>
        <div class="genderBar">
          <div id="genderMaleBar" class="genderMale" style="width:50%"></div>
          <div id="genderFemaleBar" class="genderFemale" style="width:50%"></div>
        </div>
      </div>
    </div>
    <div class="screens" id="petsContainer"></div>
</div>

<script>
    // Фоллбек-данные, если внешний массив не подключён
    if (typeof window.data_13147 === 'undefined') {
      window.data_13147 = [
        {id:"1",name:"Феникс",description:"Огненный питомец.",hp:"28",atk:"34",def:"19",spd:"22",baz_skill:"1",baz_abill:"2",male_rate:"55",female_rate:"45"},
        {id:"2",name:"Нимфа",description:"Лесной дух.",hp:"24",atk:"19",def:"23",spd:"31",baz_skill:"2",baz_abill:"8",male_rate:"30",female_rate:"70"}
      ];
    }

    function calculatePercent(value) {
        const maxStat = 40;
        return Math.min((value / maxStat) * 100, 100);
    }

    function getPetImageUrl(id) { return `https://castles-vk.ru/heroes_vk/pets/okno2/pets/${id}.png`; }

    function getSkillImageUrl(type, id) {
        if (type === 'skill') return `https://castles-vk.ru/heroes_vk/pets/okno2/skill/${id}.png`;
        if (type === 'abill') return `https://castles-vk.ru/heroes_vk/pets/okno2/abill/${id}.png`;
        return '';
    }

    function getGenderRates(pet) {
      let male = Number(pet.male_rate ?? pet.male ?? pet.gender_m ?? pet.sex_m ?? NaN);
      let female = Number(pet.female_rate ?? pet.female ?? pet.gender_f ?? pet.sex_f ?? NaN);

      if (!Number.isFinite(male) && !Number.isFinite(female)) {
        const g = String(pet.gender ?? pet.sex ?? '').toLowerCase();
        if (g === 'm' || g.includes('м')) return { male: 100, female: 0 };
        if (g === 'f' || g.includes('ж')) return { male: 0, female: 100 };
        return { male: 50, female: 50 };
      }

      if (!Number.isFinite(male)) male = Math.max(0, 100 - female);
      if (!Number.isFinite(female)) female = Math.max(0, 100 - male);

      const total = male + female;
      if (total <= 0) return { male: 50, female: 50 };
      return { male: (male / total) * 100, female: (female / total) * 100 };
    }

    function updateGenderBar(pets) {
      if (!pets.length) {
        $('#genderSummary').text('М: 0% / Ж: 0%');
        $('#genderMaleBar').css('width', '0%');
        $('#genderFemaleBar').css('width', '0%');
        return;
      }

      let maleSum = 0;
      let femaleSum = 0;
      pets.forEach(p => {
        const rate = getGenderRates(p);
        maleSum += rate.male;
        femaleSum += rate.female;
      });

      const male = Math.round(maleSum / pets.length);
      const female = Math.max(0, 100 - male);
      $('#genderSummary').text(`М: ${male}% / Ж: ${female}%`);
      $('#genderMaleBar').css('width', `${male}%`);
      $('#genderFemaleBar').css('width', `${female}%`);
    }

    function createPetScreen(petData, index, totalPets) {
        const screenId = index + 1;
        const prevScreenId = index;
        const nextScreenId = index + 2;

        const prevBtnText = index === 0 ? '' : '⬅️ Назад';
        const nextBtnText = index === totalPets - 1 ? '' : 'Дальше ➡️';
        const prevBtnFor = index === 0 ? '' : `for="pdx_p${prevScreenId}"`;
        const nextBtnFor = index === totalPets - 1 ? '' : `for="pdx_p${nextScreenId}"`;

        return `
        <section class="pdxScreen" id="screen${screenId}">
            <input type="radio" name="pdx_page" id="pdx_p${screenId}" ${index === 0 ? 'checked' : ''}>
            <img class="pdxBg" src="https://castles-vk.ru/heroes_vk/pets/okno2/fon/1.jpg" alt="">
            <div class="pdxVeil"></div>
            <div class="pdxContent">
                <div class="pdxStage">
                    <img class="pdxPet" src="${getPetImageUrl(petData.id)}" alt="${petData.name}">
                    <div class="pdxStageNav">
                        ${prevBtnText ? `<label class="pdxStageBtn" ${prevBtnFor}>${prevBtnText}</label>` : '<div></div>'}
                        ${nextBtnText ? `<label class="pdxStageBtn primary" ${nextBtnFor}>${nextBtnText}</label>` : '<div></div>'}
                    </div>
                </div>
                <aside class="pdxSide">
                    <div class="pdxCard">
                        <div class="pdxHeader">
                            <div class="pdxName">${petData.name}</div>
                            <div class="pdxId">ID: ${petData.id}</div>
                        </div>
                        <p class="pdxDesc">${petData.description || '—'}</p>
                        <div class="statsGrid">
                            <div class="stat"><div class="statTop">❤️ HP <span class="muted">${petData.hp}</span></div><div class="bar"><div class="fill" style="--w:${calculatePercent(parseInt(petData.hp) || 0)}%;"></div></div></div>
                            <div class="stat"><div class="statTop">🗡️ ATK <span class="muted">${petData.atk}</span></div><div class="bar"><div class="fill" style="--w:${calculatePercent(parseInt(petData.atk) || 0)}%;"></div></div></div>
                            <div class="stat"><div class="statTop">🛡️ DEF <span class="muted">${petData.def}</span></div><div class="bar"><div class="fill" style="--w:${calculatePercent(parseInt(petData.def) || 0)}%;"></div></div></div>
                            <div class="stat"><div class="statTop">⚡ SPD <span class="muted">${petData.spd}</span></div><div class="bar"><div class="fill" style="--w:${calculatePercent(parseInt(petData.spd) || 0)}%;"></div></div></div>
                        </div>
                    </div>
                    <div class="pdxCard">
                        ${petData.baz_skill !== "0" ? `<div class="skill"><div class="skillTitle"><div class="skillLeft"><span class="skillBadge">Активная</span><span style="opacity:.9;font-weight:900">ID: ${petData.baz_skill}</span></div><div class="skillIcons"><img src="${getSkillImageUrl('skill', petData.baz_skill)}" alt="Активный навык"></div></div><div class="skillText">${getSkillDescription(petData.baz_skill)}</div></div>` : ''}
                        ${petData.baz_abill !== "0" ? `<div class="skill"><div class="skillTitle"><div class="skillLeft"><span class="skillBadge">Врождённая</span><span style="opacity:.9;font-weight:900">ID: ${petData.baz_abill}</span></div><div class="skillIcons"><img src="${getSkillImageUrl('abill', petData.baz_abill)}" alt="Врожденный навык"></div></div><div class="skillText">${getAbilityDescription(petData.baz_abill)}</div></div>` : ''}
                        ${petData.baz_skill === "0" && petData.baz_abill === "0" ? '<div class="skill"><div class="skillText">Нет активных или врождённых навыков</div></div>' : ''}
                    </div>
                </aside>
            </div>
        </section>`;
    }

    function getSkillDescription(skillId) {
        const descriptions = {
            "1": "Наносит урон 25 ед сквозь броню и накладывает кровотечение с шансом 40% на ✦ 1-2/1-3/1-4/1-5 хода.",
            "2": "Накладывает на противника с шансом 30% ослепление, после чего он бездействует ✦ 1/1-2/1-3/1-4 хода.",
            "3": "Снимает все отрицательные эффекты с хозяина, кроме оглушения и отдыха, с шансом: 20/25/30/35%",
            "4": "Накладывает на противника заморозку на 2 хода с шансом: 20/25/30/35%",
            "5": "Оглушает противника на 2 хода с шансом: 20/25/30/35%",
            "6": "Наносит урон 15 ед сквозь броню, накладывает кровотечение на 1 ход и понижает скорость противника на: 2/3/4/5%",
            "7": "Накладывает заморозку на противника на 1 ход с шансом 50% и наносит урон от атаки владельца в размере: 3/5/6/7%",
            "8": "Открывает телепорт за энергию героя. Расходует энергии: 5/4/3/2",
            "9": "Накладывает на противника статус поджог на ✦ 2 хода и замораживает на ✦ 2 хода с шансом: 20/40/60/90",
        };
        return descriptions[skillId] || "Описание активного навыка";
    }

    function getAbilityDescription(abilityId) {
        const descriptions = {
            "1": "После победы над противником способностью 'Выстрел ружьем', шанс получить призрачную пулю c шансом 10/15/20/25% ",
            "2": "Увеличивает стат атаки героя на + 2/3/4/5%",
            "3": "Способность Кровавое исцеление героя, восстанавливает больше здоровья за 1 стак крови на 7/12/15/20",
            "4": "Усиливает конечный урон способности Разрыв плоти, после всех бонусов на: 3/5/7/10%",
            "5": "Способность Удар рыцаря имеет повышенный шанс на крит: 25/30/35/40%",
            "6": "Увеличивает стат защиты героя на + 2/4/5/6%",
            "7": "Увеличивает стат здоровья героя на + 5/6/7/8%",
            "8": "Увеличивает стат скорости героя на + 5/8/10/12%",
            "9": "Снижает расход способности некроманта Похищение жизни до 45/40/30/20%",
            "10": "Способность огненный шар мага, чаще поджигает и  увеличивает шанс на мощный взрыв до 25/30/35/40%",
            "11": "Способность шквал ударов корсара, расходует меньше выносливости на  9/8/7/6%",
            "12": "Увеличивает все статы героя на + 2/3/4/5%",
            "13": "Увеличивает дроп золота на +15/20/25/30",
            "14": "Способность Стойкая сила снимает отрицательные статусы с шансом: 50/60/70/80%",
            "15": "Дарует хозяйну иммунитет в битве к огню и льду с шансом: 50/60/70/80%",
            "16": "Создаем эпокахльный случайный предмет после победы противника в битве: 15000/12000/10000/8000 раз",
        };
        return descriptions[abilityId] || "Описание врождённого навыка";
    }

    function getValidPets() {
      return (window.data_13147 || []).filter(pet => pet.id !== "0" && pet.name !== "Пуля");
    }

    function displayAllPets(filteredPets = null) {
        const validPets = filteredPets || getValidPets();
        const container = $('#petsContainer');
        container.empty();

        if (!validPets.length) {
          container.append('<div class="pdxEmpty">Ничего не найдено. Попробуйте другое имя или ID.</div>');
          updateGenderBar([]);
          return;
        }

        validPets.forEach((pet, index) => container.append(createPetScreen(pet, index, validPets.length)));
        $('#pdx_p1').prop('checked', true);
        updateGenderBar(validPets);
    }

    function showPetOneByOne() {
        displayAllPets();

        $(document).on('click', '.pdxStageBtn', function() {
            const targetId = $(this).attr('for');
            if (targetId) {
                $('input[name="pdx_page"]').prop('checked', false);
                $('#' + targetId).prop('checked', true);
            }
        });
    }

    function bindSearch() {
      function runSearch() {
        const query = $('#petSearchInput').val().toString().trim().toLowerCase();
        const validPets = getValidPets();
        if (!query) {
          displayAllPets(validPets);
          return;
        }
        const filtered = validPets.filter(p => {
          const name = (p.name || '').toString().toLowerCase();
          const id = (p.id || '').toString().toLowerCase();
          return name.includes(query) || id.includes(query);
        });
        displayAllPets(filtered);
      }

      $('#petSearchBtn').on('click', runSearch);
      $('#petSearchInput').on('keydown', function(e){ if (e.key === 'Enter') runSearch(); });
    }

    $(document).ready(function() {
      showPetOneByOne();
      bindSearch();
    });
</script>
</body>
</html>
