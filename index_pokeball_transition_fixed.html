<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pokemon Battle & Capture Prototype</title>
  <style>
    :root {
      --ui-bg: rgba(18, 14, 12, 0.72);
      --ui-border: rgba(255, 255, 255, 0.2);
      --text: #fff4d5;
      --good: #79f5a2;
      --bad: #ff8f8f;
      --accent: #ffd46b;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, sans-serif;
      color: var(--text);
    }

    #stage, #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #gameCanvas { display: block; touch-action: none; }

    .sprite-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .sprite {
      position: absolute;
      transform-origin: center bottom;
      filter: drop-shadow(0 14px 22px rgba(0,0,0,.45));
    }

    #playerSprite { width: min(24vw, 230px); left: 16%; bottom: 12%; }
    #enemySprite { width: min(18vw, 170px); right: 15%; bottom: 22%; transform: scaleX(-1); }

    #reticle {
      position: fixed;
      border-radius: 50%;
      border: 3px solid rgba(255, 230, 170, 0.95);
      box-shadow: 0 0 0 2px rgba(255,255,255,.2), 0 0 20px rgba(255,200,100,.35);
      pointer-events: none;
      z-index: 8;
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    .hpbar {
      position: fixed;
      width: 220px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.4);
      overflow: hidden;
      z-index: 15;
    }

    .hpbar span {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #5cf198, #7cffb4);
      transition: width .25s ease;
    }

    .hp-label {
      position: fixed;
      z-index: 16;
      font-size: 12px;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,.65);
    }

    .top-controls {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 25;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: start;
    }

    .chip, .panel {
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      backdrop-filter: blur(5px);
    }

    .chip {
      padding: 10px 12px;
      font-weight: 700;
      font-size: 13px;
    }

    .weather-panel {
      display: grid;
      gap: 6px;
      padding: 10px;
      min-width: 220px;
    }

    .weather-panel select {
      width: 100%;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--ui-border);
      background: rgba(255,255,255,.08);
      color: var(--text);
      font-weight: 700;
    }

    .bottom-controls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: min(980px, calc(100vw - 20px));
      z-index: 25;
      padding: 12px;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid var(--ui-border);
      background: rgba(255,255,255,.1);
      color: var(--text);
      border-radius: 12px;
      font-weight: 900;
      font-size: 13px;
      padding: 11px 14px;
      cursor: pointer;
      min-width: 130px;
    }

    button:hover { border-color: rgba(255, 210, 110, 0.7); }
    button:disabled { opacity: .45; cursor: default; }

    #status { margin-top: 10px; font-size: 13px; font-weight: 700; color: #ffeab2; min-height: 18px; }

    #inventoryPanel {
      position: fixed;
      right: 12px;
      top: 86px;
      width: min(390px, calc(100vw - 20px));
      max-height: 72vh;
      overflow: auto;
      z-index: 30;
      padding: 10px;
      display: none;
    }

    #inventoryPanel.open { display: block; }

    .section {
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      padding: 8px;
      background: rgba(255,255,255,.03);
    }

    .section-title { font-size: 13px; font-weight: 900; margin-bottom: 7px; }

    .item {
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
      min-width: 0;
      padding: 9px 10px;
      border-radius: 10px;
    }

    .item.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(255,212,107,.5);
      background: rgba(255,212,107,.16);
    }

    .rod-art {
      width: 100%;
      height: 70px;
      border-radius: 10px;
      border: 1px dashed rgba(255,255,255,.35);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .rod-stick {
      position: absolute;
      left: 18px;
      top: 42px;
      width: 185px;
      height: 5px;
      background: #9e6b3a;
      border-radius: 4px;
      transform: rotate(-17deg);
      transform-origin: left center;
    }

    .rod-line {
      position: absolute;
      left: 180px;
      top: 10px;
      width: 2px;
      height: 42px;
      background: #dbe9ff;
    }

    .ball-center {
      position: fixed;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      z-index: 12;
      pointer-events: none;
      display: none;
    }

    .ball-center::before,
    .ball-center::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .ball-center::before {
      background: linear-gradient(180deg, #f63a3a 50%, #fff 50%);
      border: 5px solid #181818;
    }

    .ball-center::after {
      inset: 42px;
      border: 4px solid #181818;
      background: #fff;
    }

    .result {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      background: rgba(0,0,0,.55);
    }

    .result-box {
      width: min(460px, calc(100vw - 20px));
      padding: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="sprite-layer">
    <img id="playerSprite" class="sprite" src="https://play.pokemonshowdown.com/sprites/ani-back/charizard.gif" alt="player" referrerpolicy="no-referrer">
    <img id="enemySprite" class="sprite" src="https://play.pokemonshowdown.com/sprites/ani/pikachu.gif" alt="enemy" referrerpolicy="no-referrer">
  </div>

  <div id="reticle"></div>

  <div id="playerHpBar" class="hpbar"><span></span></div>
  <div id="enemyHpBar" class="hpbar"><span></span></div>
  <div id="playerHpLabel" class="hp-label"></div>
  <div id="enemyHpLabel" class="hp-label"></div>

  <div class="top-controls">
    <div class="chip" id="stateChip">Режим: Бой | Игрок HP 100% | Враг HP 100%</div>
    <div class="panel weather-panel">
      <strong>Погода</strong>
      <select id="weatherSelect">
        <option value="clear">Ясно</option>
        <option value="rain">Дождь</option>
        <option value="snow">Снег</option>
        <option value="clouds">Облака</option>
        <option value="fog">Лиса / туман</option>
        <option value="sandstorm">Песчаная буря</option>
      </select>
    </div>
    <div class="panel weather-panel">
      <strong>Локация</strong>
      <select id="biomeSelect">
        <option value="desert">Пустыня</option>
        <option value="forest">Лес</option>
        <option value="field">Поля</option>
        <option value="river">Река</option>
        <option value="mountain">Горы</option>
      </select>
    </div>
  </div>

  <div id="inventoryPanel" class="panel">
    <div class="section">
      <div class="section-title">Покеболы</div>
      <div id="ballsSection"></div>
    </div>
    <div class="section">
      <div class="section-title">Инструмент</div>
      <button class="item" id="rodSelect">🎣 Удочка натяжения — удерживай, чтобы поймать</button>
      <div class="rod-art">
        <div class="rod-stick"></div>
        <div class="rod-line"></div>
      </div>
    </div>
  </div>

  <div class="bottom-controls panel">
    <div class="controls-row">
      <strong id="modeHint">В бою вы атакуете по очереди. Для ловли откройте инвентарь.</strong>
      <button id="attackBtn">Атаковать</button>
      <button id="inventoryBtn">Инвентарь</button>
      <button id="actionBtn">Бросить покебол</button>
    </div>
    <div id="status">Цель в бою. Уберите HP врага и переходите в ловлю.</div>
  </div>

  <div id="centerBall" class="ball-center"></div>

  <div id="result" class="result">
    <div class="result-box panel">
      <h2 id="resultTitle">Поймано!</h2>
      <p id="resultText"></p>
      <button id="restartBtn">Новый бой</button>
    </div>
  </div>

  <script>
    (() => {
      const pokemonPool = ["Pikachu", "Bulbasaur", "Squirtle", "Eevee", "Growlithe", "Psyduck"];
      const spriteBase = "https://play.pokemonshowdown.com/sprites/ani/";

      const balls = [
        { key: "poke", name: "Poke Ball", bonus: 1, base: 30 },
        { key: "great", name: "Great Ball", bonus: 1.35, base: 38 },
        { key: "ultra", name: "Ultra Ball", bonus: 1.7, base: 46 },
        { key: "dusk", name: "Dusk Ball", bonus: 1.55, base: 42 }
      ];

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const playerSprite = document.getElementById("playerSprite");
      const enemySprite = document.getElementById("enemySprite");
      const reticle = document.getElementById("reticle");

      const playerHpBar = document.querySelector("#playerHpBar span");
      const enemyHpBar = document.querySelector("#enemyHpBar span");
      const playerHpLabel = document.getElementById("playerHpLabel");
      const enemyHpLabel = document.getElementById("enemyHpLabel");
      const playerHpWrap = document.getElementById("playerHpBar");
      const enemyHpWrap = document.getElementById("enemyHpBar");

      const stateChip = document.getElementById("stateChip");
      const weatherSelect = document.getElementById("weatherSelect");
      const biomeSelect = document.getElementById("biomeSelect");
      const inventoryBtn = document.getElementById("inventoryBtn");
      const inventoryPanel = document.getElementById("inventoryPanel");
      const ballsSection = document.getElementById("ballsSection");
      const rodSelect = document.getElementById("rodSelect");
      const attackBtn = document.getElementById("attackBtn");
      const actionBtn = document.getElementById("actionBtn");
      const modeHint = document.getElementById("modeHint");
      const statusEl = document.getElementById("status");
      const centerBall = document.getElementById("centerBall");

      const result = document.getElementById("result");
      const resultTitle = document.getElementById("resultTitle");
      const resultText = document.getElementById("resultText");
      const restartBtn = document.getElementById("restartBtn");

      const game = {
        w: 0,
        h: 0,
        dpr: 1,
        mode: "battle",
        playerHp: 100,
        enemyHp: 100,
        enemy: "Pikachu",
        playerTurn: true,
        selectedBall: balls[0],
        selectedTool: "ball",
        reticlePhase: 0,
        weather: "clear",
        biome: "desert",
        particles: [],
        throwAnim: null,
        rodHolding: false,
        rodPower: 0
      };

      function resize() {
        game.w = window.innerWidth;
        game.h = window.innerHeight;
        game.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(game.w * game.dpr);
        canvas.height = Math.floor(game.h * game.dpr);
        ctx.setTransform(game.dpr, 0, 0, game.dpr, 0, 0);
        layoutSprites();
      }

      function layoutSprites() {
        if (game.mode === "capture") {
          playerSprite.style.left = "50%";
          playerSprite.style.bottom = "16%";
          playerSprite.style.transform = "translateX(-50%)";
          enemySprite.style.right = "50%";
          enemySprite.style.bottom = "48%";
          enemySprite.style.transform = "translateX(50%) scaleX(-1)";
          centerBall.style.display = game.selectedTool === "ball" ? "block" : "none";
        } else {
          playerSprite.style.left = "16%";
          playerSprite.style.bottom = "12%";
          playerSprite.style.transform = "none";
          enemySprite.style.right = "15%";
          enemySprite.style.bottom = "22%";
          enemySprite.style.transform = "scaleX(-1)";
          centerBall.style.display = "none";
        }
      }

      function enemyCenter() {
        const rect = enemySprite.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height * 0.55 };
      }

      function updateReticle() {
        const c = enemyCenter();
        const min = 70;
        const max = 150;
        const pulse = (Math.sin(game.reticlePhase) + 1) / 2;
        const size = min + (max - min) * pulse;
        reticle.style.width = `${size}px`;
        reticle.style.height = `${size}px`;
        reticle.style.left = `${c.x - size / 2}px`;
        reticle.style.top = `${c.y - size / 2}px`;
        reticle.dataset.size = size.toFixed(1);
      }

      function updateHpBars() {
        playerHpBar.style.width = `${game.playerHp}%`;
        enemyHpBar.style.width = `${game.enemyHp}%`;
        playerHpLabel.textContent = `Игрок HP ${game.playerHp}%`;
        enemyHpLabel.textContent = `${game.enemy} HP ${game.enemyHp}%`;

        const pRect = playerSprite.getBoundingClientRect();
        const eRect = enemySprite.getBoundingClientRect();
        playerHpWrap.style.left = `${pRect.left + pRect.width / 2 - 110}px`;
        playerHpWrap.style.top = `${pRect.top - 18}px`;
        enemyHpWrap.style.left = `${eRect.left + eRect.width / 2 - 110}px`;
        enemyHpWrap.style.top = `${eRect.top - 20}px`;

        playerHpLabel.style.left = `${pRect.left + pRect.width / 2 - 50}px`;
        playerHpLabel.style.top = `${pRect.top - 36}px`;
        enemyHpLabel.style.left = `${eRect.left + eRect.width / 2 - 48}px`;
        enemyHpLabel.style.top = `${eRect.top - 38}px`;

        stateChip.textContent = `Режим: ${game.mode === "battle" ? "Бой" : "Ловля"} | Игрок HP ${game.playerHp}% | Враг HP ${game.enemyHp}%`;
      }

      function drawBiome() {
        if (game.biome === "desert") {
          const g = ctx.createLinearGradient(0, 0, 0, game.h);
          g.addColorStop(0, "#e6a96a"); g.addColorStop(1, "#b77a3d");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.w, game.h);
        } else if (game.biome === "forest") {
          const g = ctx.createLinearGradient(0, 0, 0, game.h);
          g.addColorStop(0, "#6db7ff"); g.addColorStop(1, "#1f5d2f");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.w, game.h);
          ctx.fillStyle = "rgba(20,70,30,.7)";
          for (let i = 0; i < 22; i++) ctx.fillRect(i * 90, game.h * 0.52, 28, game.h * 0.5);
        } else if (game.biome === "field") {
          const g = ctx.createLinearGradient(0, 0, 0, game.h);
          g.addColorStop(0, "#8dd1ff"); g.addColorStop(1, "#4fa43f");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.w, game.h);
        } else if (game.biome === "river") {
          const g = ctx.createLinearGradient(0, 0, 0, game.h);
          g.addColorStop(0, "#a8dcff"); g.addColorStop(1, "#2f8ec4");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.w, game.h);
          ctx.fillStyle = "rgba(14,55,120,.55)";
          ctx.fillRect(game.w * 0.3, game.h * 0.55, game.w * 0.4, game.h * 0.45);
        } else {
          const g = ctx.createLinearGradient(0, 0, 0, game.h);
          g.addColorStop(0, "#b6ccdf"); g.addColorStop(1, "#676d76");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, game.w, game.h);
        }
      }

      function ensureParticles() {
        if (game.particles.length) return;
        for (let i = 0; i < 120; i++) {
          game.particles.push({ x: Math.random() * game.w, y: Math.random() * game.h, s: 1 + Math.random() * 2, v: 1 + Math.random() * 3 });
        }
      }

      function drawWeather() {
        ensureParticles();
        if (game.weather === "clear") return;

        if (game.weather === "clouds") {
          ctx.fillStyle = "rgba(255,255,255,.25)";
          for (let i = 0; i < 7; i++) ctx.fillRect((i * 180 + performance.now() * 0.015) % (game.w + 260) - 140, 70 + i * 18, 140, 36);
          return;
        }

        for (const p of game.particles) {
          if (game.weather === "rain") {
            ctx.strokeStyle = "rgba(180,220,255,.7)";
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 4, p.y + 12);
            ctx.stroke();
            p.y += p.v * 2.4;
          } else if (game.weather === "snow") {
            ctx.fillStyle = "rgba(255,255,255,.82)";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
            ctx.fill();
            p.y += p.v * 0.4;
          } else if (game.weather === "fog") {
            ctx.fillStyle = "rgba(230,230,230,.12)";
            ctx.fillRect(p.x, p.y, 80, 24);
            p.x += 0.5;
          } else if (game.weather === "sandstorm") {
            ctx.fillStyle = "rgba(215,175,120,.4)";
            ctx.fillRect(p.x, p.y, 4, 2);
            p.x -= 2.3;
          }

          if (p.y > game.h + 20) { p.y = -20; p.x = Math.random() * game.w; }
          if (p.x > game.w + 20) p.x = -20;
          if (p.x < -20) p.x = game.w + 20;
        }
      }

      function drawThrowAnim() {
        if (!game.throwAnim) return;
        const a = game.throwAnim;
        const t = Math.min(1, (performance.now() - a.start) / 760);
        const x = a.fromX + (a.toX - a.fromX) * t;
        const y = a.fromY + (a.toY - a.fromY) * t - Math.sin(t * Math.PI) * 160;
        const r = 40 - t * 28;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(t * 10);
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#de2121";
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#121212";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (t >= 1) game.throwAnim = null;
      }

      function attack() {
        if (game.mode !== "battle" || !game.playerTurn || result.style.display === "flex") return;
        const dmg = 14 + Math.floor(Math.random() * 8);
        game.enemyHp = Math.max(0, game.enemyHp - dmg);
        statusEl.textContent = `Вы нанесли ${dmg} урона!`;
        game.playerTurn = false;
        updateHpBars();

        if (game.enemyHp <= 0) {
          statusEl.textContent = "Враг ослаблен. Откройте инвентарь для режима ловли!";
          return;
        }

        setTimeout(() => {
          const enemyDmg = 10 + Math.floor(Math.random() * 9);
          game.playerHp = Math.max(0, game.playerHp - enemyDmg);
          statusEl.textContent = `${game.enemy} атакует: -${enemyDmg} HP.`;
          game.playerTurn = true;
          updateHpBars();
          if (game.playerHp <= 0) {
            showResult(false, "Ваш покемон выбит. Перезапустите бой.");
          }
        }, 800);
      }

      function openInventoryForCapture() {
        game.mode = "capture";
        inventoryPanel.classList.add("open");
        attackBtn.disabled = true;
        actionBtn.disabled = false;
        actionBtn.textContent = game.selectedTool === "ball" ? "Бросить покебол" : "Удерживать удочку";
        modeHint.textContent = "Режим ловли: выберите покебол или удочку, затем выполните действие.";
        statusEl.textContent = "Ловля активирована. Персонаж и покебол — по центру, цель вдалеке.";
        layoutSprites();
        updateHpBars();
      }

      function chooseBall(ball, btn) {
        game.selectedTool = "ball";
        game.selectedBall = ball;
        rodSelect.classList.remove("selected");
        [...ballsSection.querySelectorAll(".item")].forEach((x) => x.classList.remove("selected"));
        btn.classList.add("selected");
        inventoryPanel.classList.remove("open");
        actionBtn.textContent = "Бросить покебол";
        centerBall.style.display = "block";
        statusEl.textContent = `${ball.name} выбран. Инвентарь закрыт, бросайте по мигающему прицелу.`;
      }

      function handleActionDown() {
        if (game.mode !== "capture") return;
        if (game.selectedTool === "rod") {
          game.rodHolding = true;
          statusEl.textContent = "Натягиваем удочку... удерживайте!";
        } else {
          throwBall();
        }
      }

      function handleActionUp() {
        if (game.mode !== "capture" || game.selectedTool !== "rod" || !game.rodHolding) return;
        game.rodHolding = false;
        const success = game.rodPower >= 85;
        game.rodPower = 0;
        if (success) {
          showResult(true, `Пойман на удочку натяжением! (${game.enemy})`);
        } else {
          statusEl.textContent = "Слабое натяжение. Удерживайте дольше для уверенной поимки.";
        }
      }

      function throwBall() {
        const size = Number(reticle.dataset.size || 140);
        const sizeFactor = 1 - (size - 70) / 80;
        const hpFactor = (100 - game.enemyHp) / 100;
        const chance = Math.min(97, Math.round((game.selectedBall.base + hpFactor * 30 + sizeFactor * 35) * game.selectedBall.bonus));
        const roll = Math.random() * 100;

        const fromX = game.w * 0.5;
        const fromY = game.h * 0.58;
        const t = enemyCenter();
        game.throwAnim = { start: performance.now(), fromX, fromY, toX: t.x, toY: t.y };

        if (roll < chance) {
          setTimeout(() => showResult(true, `${game.enemy} пойман! Шанс: ${chance}%`), 720);
        } else {
          setTimeout(() => {
            statusEl.textContent = `Промах/рывок! Шанс был ${chance}%. Попробуйте ещё раз.`;
          }, 720);
        }
      }

      function showResult(success, text) {
        result.style.display = "flex";
        resultTitle.textContent = success ? "Успех!" : "Поражение";
        resultTitle.style.color = success ? "var(--good)" : "var(--bad)";
        resultText.textContent = text;
      }

      function setEnemy(name) {
        game.enemy = name;
        enemySprite.src = `${spriteBase}${name.toLowerCase()}.gif`;
      }

      function renderInventory() {
        ballsSection.innerHTML = "";
        balls.forEach((ball) => {
          const b = document.createElement("button");
          b.className = `item${ball.key === game.selectedBall.key ? " selected" : ""}`;
          b.textContent = `${ball.name} — базовый шанс ${ball.base}%`;
          b.addEventListener("click", () => chooseBall(ball, b));
          ballsSection.appendChild(b);
        });
      }

      function resetGame() {
        result.style.display = "none";
        game.playerHp = 100;
        game.enemyHp = 100;
        game.mode = "battle";
        game.playerTurn = true;
        const next = pokemonPool[Math.floor(Math.random() * pokemonPool.length)];
        setEnemy(next);
        inventoryPanel.classList.remove("open");
        attackBtn.disabled = false;
        actionBtn.textContent = "Бросить покебол";
        modeHint.textContent = "В бою вы атакуете по очереди. Для ловли откройте инвентарь.";
        statusEl.textContent = "Новый бой начат.";
        layoutSprites();
        updateHpBars();
      }

      function tick() {
        drawBiome();
        drawWeather();
        drawThrowAnim();

        game.reticlePhase += 0.05;
        updateReticle();

        if (game.rodHolding) {
          game.rodPower = Math.min(100, game.rodPower + 0.45);
          statusEl.textContent = `Натяжение удочки: ${Math.round(game.rodPower)}%`;
        }

        updateHpBars();
        requestAnimationFrame(tick);
      }

      attackBtn.addEventListener("click", attack);

      inventoryBtn.addEventListener("click", () => {
        if (game.mode === "battle") {
          openInventoryForCapture();
        } else {
          inventoryPanel.classList.toggle("open");
        }
      });

      rodSelect.addEventListener("click", () => {
        game.selectedTool = "rod";
        rodSelect.classList.add("selected");
        [...ballsSection.querySelectorAll(".item")].forEach((x) => x.classList.remove("selected"));
        actionBtn.textContent = "Удерживать удочку";
        inventoryPanel.classList.remove("open");
        centerBall.style.display = "none";
        statusEl.textContent = "Удочка выбрана. Зажмите кнопку действия и держите до полного натяжения.";
      });

      actionBtn.addEventListener("pointerdown", handleActionDown);
      actionBtn.addEventListener("pointerup", handleActionUp);
      actionBtn.addEventListener("pointerleave", handleActionUp);

      weatherSelect.addEventListener("change", () => {
        game.weather = weatherSelect.value;
        game.particles = [];
      });

      biomeSelect.addEventListener("change", () => {
        game.biome = biomeSelect.value;
      });

      restartBtn.addEventListener("click", resetGame);

      window.addEventListener("resize", resize);
      resize();
      renderInventory();
      resetGame();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
