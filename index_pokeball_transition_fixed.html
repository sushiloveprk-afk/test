<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Desert Poké Capture Mini‑Game</title>
  <style>
    :root {
      --ui-bg: rgba(16, 12, 8, 0.55);
      --ui-border: rgba(255, 255, 255, 0.2);
      --text: #fff5de;
      --danger: #ff6b6b;
      --ok: #72ef9a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e170f; }

    #stage { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .sprite-layer { position: absolute; inset: 0; pointer-events: none; }
    .sprite {
      position: absolute;
      image-rendering: auto;
      transform-origin: center bottom;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.4));
    }

    #playerSprite {
      width: min(24vw, 230px);
      left: 9%;
      bottom: 16%;
    }

    #enemySprite {
      width: min(17vw, 150px);
      right: 14%;
      bottom: 23%;
      transform: scaleX(-1);
    }

    .hud {
      position: fixed;
      left: 10px;
      right: 10px;
      top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      z-index: 20;
    }

    .chip {
      padding: 9px 11px;
      border-radius: 999px;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      color: var(--text);
      backdrop-filter: blur(4px);
      font: 700 13px/1.2 system-ui, sans-serif;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }

    .controls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: min(900px, calc(100vw - 20px));
      z-index: 22;
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 16px;
      padding: 12px;
      color: var(--text);
      backdrop-filter: blur(6px);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    .slider-wrap { display: grid; gap: 6px; }
    .label { font: 800 13px/1.2 system-ui, sans-serif; }
    .value { color: #ffdb7a; }

    input[type="range"] { width: 100%; }

    button {
      border: 1px solid var(--ui-border);
      background: rgba(255,255,255,0.1);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font: 900 14px/1 system-ui, sans-serif;
      cursor: pointer;
      min-width: 130px;
    }

    button:disabled { opacity: 0.45; cursor: default; }

    .status {
      margin-top: 10px;
      min-height: 18px;
      font: 700 13px/1.3 system-ui, sans-serif;
      color: #f9e8b8;
    }

    #loader {
      margin-top: 8px;
      display: none;
      gap: 6px;
      align-items: center;
    }

    #loaderTrack {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--ui-border);
      background: rgba(0,0,0,0.25);
    }

    #loaderFill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffbe55, #ff5a5a);
      transition: width 0.1s linear;
    }

    .result {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      background: rgba(0,0,0,.56);
    }

    .result-box {
      width: min(520px, calc(100vw - 24px));
      background: rgba(30, 20, 10, 0.9);
      border: 1px solid var(--ui-border);
      border-radius: 18px;
      padding: 18px;
      color: var(--text);
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    #pokeballTransition {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
      display: none;
    }

    #pokeballTransition.active { display: block; }

    .half {
      position: absolute;
      left: -12vw;
      right: -12vw;
      height: 58vh;
      transition: transform 0.36s cubic-bezier(.2,.85,.2,1);
      filter: drop-shadow(0 18px 40px rgba(0,0,0,.5));
    }

    .top-half {
      top: -9vh;
      transform: translateY(-120%);
      border-bottom-left-radius: 999px;
      border-bottom-right-radius: 999px;
      background: linear-gradient(180deg, #ff7878, #d81010 65%);
    }

    .bottom-half {
      bottom: -9vh;
      transform: translateY(120%);
      border-top-left-radius: 999px;
      border-top-right-radius: 999px;
      background: linear-gradient(0deg, #ffffff, #e4e4e4 70%);
    }

    .belt {
      position: absolute;
      left: -12vw;
      right: -12vw;
      top: 50%;
      height: 9vh;
      transform: translateY(-50%) scaleX(0);
      transform-origin: center;
      background: #161616;
      transition: transform 0.2s ease;
    }

    #pokeballTransition.closed .top-half,
    #pokeballTransition.closed .bottom-half { transform: translateY(0%); }
    #pokeballTransition.closed .belt { transform: translateY(-50%) scaleX(1); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <div class="sprite-layer">
      <img id="playerSprite" class="sprite" src="https://play.pokemonshowdown.com/sprites/ani-back/charizard.gif" alt="player pokemon" referrerpolicy="no-referrer">
      <img id="enemySprite" class="sprite" src="https://play.pokemonshowdown.com/sprites/ani/sandslash.gif" alt="enemy pokemon" referrerpolicy="no-referrer">
    </div>
  </div>

  <div class="hud">
    <div class="chip">Локация: <b>Пустыня Сиен</b></div>
    <div class="chip">Покемон: <b id="enemyName">Sandslash</b></div>
    <div class="chip">HP цели: <b id="enemyHp">100</b>%</div>
    <div class="chip">Результат броска: <b id="captureChance">0</b>%</div>
  </div>

  <div class="controls">
    <div class="controls-grid">
      <div class="slider-wrap">
        <div class="label">Радиус прицеливания: <span id="radiusValue" class="value">160</span> px</div>
        <input id="radiusSlider" type="range" min="80" max="260" step="5" value="160">
      </div>
      <button id="weakenBtn">Ослабить цель</button>
      <button id="throwBtn">Кинуть покебол</button>
    </div>

    <div id="loader">
      <span style="font:700 12px system-ui;">Загрузка скриптов ловли…</span>
      <div id="loaderTrack"><div id="loaderFill"></div></div>
      <span id="loaderPct" style="font:700 12px system-ui; width:40px; text-align:right;">0%</span>
    </div>

    <div class="status" id="status">Подготовься к броску. Чем больше радиус — тем легче попасть.</div>
  </div>

  <div id="pokeballTransition" aria-hidden="true">
    <div class="half top-half"></div>
    <div class="half bottom-half"></div>
    <div class="belt"></div>
  </div>

  <div class="result" id="result">
    <div class="result-box">
      <h2 id="resultTitle">Поймано!</h2>
      <p id="resultText">Поздравляем!</p>
      <button id="restartBtn">Новый противник</button>
    </div>
  </div>

<script>
(() => {
  const pokemonPool = ["Sandslash", "Cubone", "Trapinch", "Hippopotas", "Sandshrew", "Numel"];
  const spriteBase = "https://play.pokemonshowdown.com/sprites/ani/";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const enemySprite = document.getElementById("enemySprite");
  const enemyNameEl = document.getElementById("enemyName");
  const enemyHpEl = document.getElementById("enemyHp");
  const captureChanceEl = document.getElementById("captureChance");
  const radiusSlider = document.getElementById("radiusSlider");
  const radiusValue = document.getElementById("radiusValue");
  const throwBtn = document.getElementById("throwBtn");
  const weakenBtn = document.getElementById("weakenBtn");
  const statusEl = document.getElementById("status");

  const loader = document.getElementById("loader");
  const loaderFill = document.getElementById("loaderFill");
  const loaderPct = document.getElementById("loaderPct");

  const transition = document.getElementById("pokeballTransition");
  const result = document.getElementById("result");
  const resultTitle = document.getElementById("resultTitle");
  const resultText = document.getElementById("resultText");
  const restartBtn = document.getElementById("restartBtn");

  let w = 0;
  let h = 0;
  let dpr = 1;
  let radius = Number(radiusSlider.value);
  let enemyHp = 100;
  let runningThrow = false;
  let rngSeed = Math.random() * 9999;
  let activeBall = null;

  const state = {
    enemyX: 0,
    enemyY: 0,
    enemyR: 42,
    ballX: 0,
    ballY: 0,
    ballVX: 0,
    ballVY: 0,
    ballR: 16,
    trail: []
  };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.enemyX = w * 0.74;
    state.enemyY = h * 0.58;
  }

  function noise(t) { return Math.sin(t) * 0.5 + Math.sin(t * 0.7 + 12.2) * 0.3 + Math.sin(t * 1.31 + 4.6) * 0.2; }

  function drawBackground(t) {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.72);
    skyGrad.addColorStop(0, "#f3b06a");
    skyGrad.addColorStop(0.45, "#e89f61");
    skyGrad.addColorStop(1, "#d18749");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 4; i++) {
      const y = h * (0.28 + i * 0.11);
      const alpha = 0.09 - i * 0.015;
      ctx.fillStyle = `rgba(255,240,210,${Math.max(alpha, 0.02)})`;
      ctx.fillRect(0, y, w, 20 + i * 4);
    }

    const dune1 = ctx.createLinearGradient(0, h * 0.46, 0, h);
    dune1.addColorStop(0, "#d99a53");
    dune1.addColorStop(1, "#b27334");
    ctx.fillStyle = dune1;
    ctx.beginPath();
    ctx.moveTo(0, h * 0.62);
    for (let x = 0; x <= w; x += 10) {
      const y = h * 0.62 + Math.sin(x * 0.01 + t * 0.001) * 20;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#935a2a";
    ctx.beginPath();
    ctx.moveTo(0, h * 0.76);
    for (let x = 0; x <= w; x += 12) {
      const y = h * 0.76 + Math.sin(x * 0.012 + t * 0.0015 + 2) * 24;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
    ctx.fill();
  }

  function drawReticle() {
    ctx.strokeStyle = "rgba(255, 248, 224, 0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(state.enemyX, state.enemyY, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([8, 10]);
    ctx.strokeStyle = "rgba(255, 226, 155, 0.8)";
    ctx.beginPath();
    ctx.arc(state.enemyX, state.enemyY, radius * 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBall() {
    if (!activeBall) return;
    for (const p of state.trail) {
      ctx.fillStyle = `rgba(255,245,220,${p.a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    const x = state.ballX;
    const y = state.ballY;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 0, state.ballR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#da1919";
    ctx.beginPath();
    ctx.arc(0, 0, state.ballR, Math.PI, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#151515";
    ctx.fillRect(-state.ballR, -2, state.ballR * 2, 4);
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#f8f8f8";
    ctx.fill();
    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  function computeChance(distance) {
    const radiusFactor = Math.min(1, Math.max(0.25, radius / 200));
    const hitFactor = Math.max(0, 1 - distance / radius);
    const hpFactor = Math.max(0.25, (100 - enemyHp) / 100 + 0.25);
    const chance = Math.min(95, Math.round(100 * (hitFactor * 0.6 + radiusFactor * 0.15 + hpFactor * 0.25)));
    return chance;
  }

  function setEnemy(name) {
    enemyNameEl.textContent = name;
    enemySprite.src = `${spriteBase}${name.toLowerCase()}.gif`;
    enemyHp = 100;
    enemyHpEl.textContent = enemyHp;
    captureChanceEl.textContent = "0";
    statusEl.textContent = "Новый враг появился. Ослабь цель и настрой радиус для точного броска.";
  }

  async function scriptLoading() {
    loader.style.display = "flex";
    loaderFill.style.width = "0%";
    loaderPct.textContent = "0%";
    for (let p = 0; p <= 100; p += 10) {
      loaderFill.style.width = `${p}%`;
      loaderPct.textContent = `${p}%`;
      await new Promise(r => setTimeout(r, 40));
    }
    loader.style.display = "none";
  }

  function openTransition() {
    transition.classList.add("active");
    transition.classList.add("closed");
  }

  function closeTransition() {
    transition.classList.remove("closed");
    setTimeout(() => transition.classList.remove("active"), 400);
  }

  async function throwBall() {
    if (runningThrow) return;
    runningThrow = true;
    throwBtn.disabled = true;
    weakenBtn.disabled = true;

    await scriptLoading();
    openTransition();

    state.ballX = w * 0.2;
    state.ballY = h * 0.72;
    const dx = state.enemyX - state.ballX;
    const dy = state.enemyY - state.ballY;

    const spread = (260 - radius) * 0.09;
    const sway = noise(rngSeed += 0.6) * spread;
    state.ballVX = dx * 0.04 + sway;
    state.ballVY = dy * 0.04 - 7;
    state.trail = [];

    activeBall = true;
    const gravity = 0.23;

    let hit = false;
    for (let frame = 0; frame < 110; frame++) {
      state.ballX += state.ballVX;
      state.ballY += state.ballVY;
      state.ballVY += gravity;
      state.ballVX *= 0.993;

      if (state.trail.length > 22) state.trail.shift();
      state.trail.push({ x: state.ballX, y: state.ballY, r: 2 + Math.random() * 2, a: 0.12 + Math.random() * 0.22 });

      const d = Math.hypot(state.ballX - state.enemyX, state.ballY - state.enemyY);
      if (d < radius * 0.48) {
        hit = true;
        const chance = computeChance(d);
        captureChanceEl.textContent = chance;
        const success = Math.random() * 100 < chance;
        await new Promise(r => setTimeout(r, 200));
        activeBall = false;
        closeTransition();
        await new Promise(r => setTimeout(r, 250));
        showResult(success, chance);
        break;
      }

      if (state.ballY > h + 40) break;
      await new Promise(r => requestAnimationFrame(r));
    }

    if (!hit) {
      activeBall = false;
      closeTransition();
      statusEl.textContent = "Промах! Увеличь радиус или ослабь цель сильнее.";
      captureChanceEl.textContent = "0";
    }

    runningThrow = false;
    throwBtn.disabled = false;
    weakenBtn.disabled = false;
  }

  function showResult(success, chance) {
    result.style.display = "flex";
    if (success) {
      resultTitle.textContent = "Поймано!";
      resultTitle.style.color = "var(--ok)";
      resultText.textContent = `Ты поймал ${enemyNameEl.textContent} с шансом ${chance}%. Отличный бросок!`;
      statusEl.textContent = "Успех! Можно запускать новый раунд.";
    } else {
      resultTitle.textContent = "Вырвался!";
      resultTitle.style.color = "var(--danger)";
      resultText.textContent = `${enemyNameEl.textContent} вырвался. Попробуй снова: уменьшай HP и корректируй радиус.`;
      statusEl.textContent = "Неудача. Проанализируй радиус и бросай ещё раз.";
    }
  }

  function tick(ts) {
    drawBackground(ts);
    drawReticle();
    drawBall();

    const bob = Math.sin(ts * 0.003) * 4;
    enemySprite.style.transform = `scaleX(-1) translateY(${bob}px)`;
    requestAnimationFrame(tick);
  }

  radiusSlider.addEventListener("input", () => {
    radius = Number(radiusSlider.value);
    radiusValue.textContent = radius;
    statusEl.textContent = `Радиус ${radius}px установлен. ${radius > 200 ? "Бросок стабильнее." : "Выше риск промаха, но награда больше."}`;
  });

  weakenBtn.addEventListener("click", () => {
    enemyHp = Math.max(5, enemyHp - 15);
    enemyHpEl.textContent = enemyHp;
    statusEl.textContent = `Цель ослаблена. HP противника: ${enemyHp}%.`;
  });

  throwBtn.addEventListener("click", throwBall);

  restartBtn.addEventListener("click", () => {
    result.style.display = "none";
    const next = pokemonPool[Math.floor(Math.random() * pokemonPool.length)];
    setEnemy(next);
  });

  window.addEventListener("resize", resize);
  resize();
  setEnemy(pokemonPool[0]);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
