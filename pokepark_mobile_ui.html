<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PokePark Mobile Browser HUD</title>
  <style>
    :root {
      --safe-top: max(16px, env(safe-area-inset-top));
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
      --hud-dark: rgba(10, 27, 49, 0.72);
      --hud-border: rgba(180, 220, 255, 0.32);
      --glass-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
      --text: #eef7ff;
      --primary: #38a8ff;
      --primary-strong: #2f8ef8;
      --active: #0fb2ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", system-ui, -apple-system, sans-serif;
      background: #9bd0ff;
      color: var(--text);
    }

    .game {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      aspect-ratio: 9 / 16;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
      background: #94d2ff;
    }

    .world-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: url('http://castles-vk.ru/pokepark/img/location/1.png') center / cover no-repeat;
      transform: translateZ(0);
    }

    .buildings-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .hitbox {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 26px;
      transform: translateZ(0);
      touch-action: manipulation;
    }

    .hitbox:active {
      transform: scale(0.98);
    }

    .hitbox.debug {
      background: rgba(76, 193, 255, 0.18);
      outline: 1px dashed rgba(158, 220, 255, 0.4);
    }

    .hud-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .top-hud {
      position: absolute;
      top: var(--safe-top);
      left: 18px;
      right: 18px;
      height: 120px;
      display: flex;
      gap: 14px;
      align-items: stretch;
      pointer-events: auto;
    }

    .panel {
      background: var(--hud-dark);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(10px);
      box-shadow: var(--glass-shadow);
      border-radius: 26px;
    }

    .trainer-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(159, 220, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(41, 99, 166, 0.5);
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 20%, #2b89ff, #0b2646);
      font-size: 34px;
    }

    .trainer-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .level {
      font-size: 44px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .xp-shell {
      position: relative;
      width: min(100%, 450px);
      height: 24px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(11, 28, 52, 0.8);
      border: 1px solid rgba(157, 219, 255, 0.35);
    }

    .xp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2f9bff, #3cd9a8);
      box-shadow: 0 0 10px rgba(72, 210, 173, 0.6);
      transform-origin: left center;
      transition: width 550ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .xp-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
    }

    .currency-panel {
      min-width: 360px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
    }

    .currency {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 40px;
      font-weight: 700;
    }

    .action-icons {
      position: absolute;
      top: calc(var(--safe-top) + 132px);
      right: 18px;
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .action-btn {
      position: relative;
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: var(--hud-dark);
      color: #f3fbff;
      font-size: 30px;
      border: 1px solid var(--hud-border);
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -3px;
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #ff4444;
      color: white;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      padding: 0 6px;
    }

    .marker {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      color: #fff;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .marker-lab {
      background: radial-gradient(circle, rgba(105, 210, 255, 0.92), rgba(30, 110, 255, 0.65));
      box-shadow: 0 0 22px rgba(84, 181, 255, 0.7);
      animation: labPulse 2.5s ease-in-out infinite;
    }

    .marker-house {
      background: rgba(35, 72, 129, 0.85);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.3);
      animation: markerFloat 2.2s ease-in-out infinite;
    }

    .marker-home { background: rgba(80, 160, 255, 0.7); }
    .marker-quest { background: rgba(255, 158, 35, 0.95); }
    .marker-unknown { background: rgba(169, 89, 255, 0.88); }

    .scan-ring {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(112, 212, 255, 0.8);
      background: rgba(86, 182, 255, 0.18);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
    }

    .scan-ring.active {
      animation: scanPulse 950ms ease-out 1;
    }

    .bottom-nav {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: var(--safe-bottom);
      height: 160px;
      border-radius: 32px 32px 24px 24px;
      padding: 14px 10px 16px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      pointer-events: auto;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #edf6ff;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 220ms ease, transform 160ms ease;
    }

    .nav-btn:active {
      transform: translateY(2px);
    }

    .nav-icon {
      font-size: 44px;
      line-height: 1;
      opacity: 0.95;
    }

    .nav-btn.active {
      background: linear-gradient(160deg, rgba(26, 137, 255, 0.48), rgba(43, 186, 255, 0.22));
      box-shadow: inset 0 0 0 1px rgba(127, 214, 255, 0.8), 0 0 16px rgba(62, 174, 255, 0.5);
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: -360px;
      width: min(360px, 84vw);
      height: 100%;
      padding: calc(var(--safe-top) + 24px) 20px 20px;
      border-left: 1px solid rgba(150, 210, 255, 0.35);
      background: linear-gradient(180deg, rgba(7, 28, 52, 0.95), rgba(11, 35, 61, 0.95));
      transition: right 300ms cubic-bezier(0.2, 0.85, 0.2, 1);
      z-index: 4;
      pointer-events: auto;
      box-shadow: -15px 0 24px rgba(0, 0, 0, 0.35);
    }

    .menu-panel.open {
      right: 0;
    }

    .menu-panel h2 {
      margin: 0 0 18px;
      font-size: 28px;
    }

    .menu-item {
      border: 1px solid rgba(153, 208, 255, 0.25);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      background: rgba(137, 192, 255, 0.08);
      font-weight: 700;
      font-size: 19px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 176px);
      transform: translateX(-50%);
      background: rgba(9, 26, 47, 0.86);
      border: 1px solid rgba(165, 220, 255, 0.45);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 5;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }

    @keyframes markerFloat {
      50% { transform: translate(-50%, calc(-50% - 3px)); }
    }

    @keyframes labPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    @keyframes scanPulse {
      0% { opacity: 0.8; width: 12px; height: 12px; }
      100% { opacity: 0; width: 600px; height: 600px; }
    }
  </style>
</head>
<body>
  <main class="game" id="gameRoot">
    <section class="world-layer"></section>

    <section class="buildings-layer" id="buildingLayer"></section>

    <section class="hud-layer">
      <header class="top-hud">
        <div class="panel trainer-panel">
          <div class="avatar">🧢</div>
          <div class="trainer-info">
            <div class="level">Lv.5</div>
            <div class="xp-shell">
              <div id="xpFill" class="xp-fill"></div>
              <div id="xpText" class="xp-text">450 / 1000 XP</div>
            </div>
          </div>
        </div>

        <div class="panel currency-panel">
          <div class="currency">🪙 <span>12,500</span></div>
          <div class="currency">💎 <span>250</span></div>
        </div>
      </header>

      <div class="action-icons">
        <button class="action-btn" aria-label="Mail">✉️<span class="badge">3</span></button>
        <button class="action-btn" aria-label="Notifications">🔔<span class="badge">1</span></button>
        <button class="action-btn" aria-label="Gift">🎁</button>
      </div>

      <div id="scanRing" class="scan-ring"></div>

      <div id="toast" class="toast"></div>

      <nav class="panel bottom-nav">
        <button class="nav-btn active" data-nav="home"><span class="nav-icon">⌂</span>Home</button>
        <button class="nav-btn" data-nav="world"><span class="nav-icon">🗺️</span>World</button>
        <button class="nav-btn" id="searchBtn" data-nav="search"><span class="nav-icon">⌕</span>Search</button>
        <button class="nav-btn" data-nav="bag"><span class="nav-icon">👜</span>Bag</button>
        <button class="nav-btn" id="menuBtn" data-nav="menu"><span class="nav-icon">☰</span>Menu</button>
      </nav>
    </section>

    <aside id="menuPanel" class="menu-panel">
      <h2>Menu</h2>
      <div class="menu-item">Settings</div>
      <div class="menu-item">Friends</div>
      <div class="menu-item">Achievements</div>
      <div class="menu-item">Events</div>
      <div class="menu-item">Help</div>
    </aside>
  </main>

  <script>
    const buildingHitboxes = [
      { id: 'lab-main', type: 'lab', x: 350, y: 615, width: 385, height: 360, marker: '🔬', markerX: 540, markerY: 610, markerClass: 'marker-lab', label: 'Professor Laboratory' },
      { id: 'house-left', type: 'house', x: 35, y: 610, width: 280, height: 330, marker: '⌂', markerX: 160, markerY: 610, markerClass: 'marker-house marker-home', label: 'Northwest House' },
      { id: 'house-right', type: 'house', x: 760, y: 700, width: 265, height: 320, marker: '?', markerX: 868, markerY: 695, markerClass: 'marker-house marker-unknown', label: 'Northeast House' },
      { id: 'house-left-bottom', type: 'house', x: 15, y: 1025, width: 300, height: 325, marker: '⌂', markerX: 148, markerY: 1018, markerClass: 'marker-house marker-home', label: 'Southwest House' },
      { id: 'house-right-bottom', type: 'house', x: 735, y: 980, width: 302, height: 334, marker: '!', markerX: 870, markerY: 980, markerClass: 'marker-house marker-quest', label: 'Southeast House' },
      { id: 'road-exit', type: 'road_exit', x: 430, y: 360, width: 220, height: 220, marker: '⚑', markerX: 560, markerY: 515, markerClass: 'marker-house marker-home', label: 'Road Exit' }
    ];

    const DESIGN_WIDTH = 1080;
    const DESIGN_HEIGHT = 1920;

    const gameRoot = document.getElementById('gameRoot');
    const buildingLayer = document.getElementById('buildingLayer');
    const menuPanel = document.getElementById('menuPanel');
    const menuBtn = document.getElementById('menuBtn');
    const searchBtn = document.getElementById('searchBtn');
    const scanRing = document.getElementById('scanRing');
    const xpFill = document.getElementById('xpFill');
    const xpText = document.getElementById('xpText');
    const toast = document.getElementById('toast');

    const state = {
      xpCurrent: 450,
      xpTotal: 1000,
      searchMode: false,
      toastTimer: null,
      debugHitbox: false
    };

    const setCssVarsForScale = () => {
      const rect = gameRoot.getBoundingClientRect();
      const scaleX = rect.width / DESIGN_WIDTH;
      const scaleY = rect.height / DESIGN_HEIGHT;
      buildingLayer.innerHTML = '';

      buildingHitboxes.forEach((entry) => {
        const hitbox = document.createElement('button');
        hitbox.className = `hitbox${state.debugHitbox ? ' debug' : ''}`;
        hitbox.dataset.id = entry.id;
        hitbox.dataset.type = entry.type;
        hitbox.ariaLabel = entry.label;

        const marker = document.createElement('div');
        marker.className = `marker ${entry.markerClass}`;
        marker.textContent = entry.marker;

        hitbox.style.left = `${entry.x * scaleX}px`;
        hitbox.style.top = `${entry.y * scaleY}px`;
        hitbox.style.width = `${entry.width * scaleX}px`;
        hitbox.style.height = `${entry.height * scaleY}px`;

        marker.style.left = `${entry.markerX * scaleX}px`;
        marker.style.top = `${entry.markerY * scaleY}px`;

        hitbox.addEventListener('click', () => onBuildingTap(entry));

        buildingLayer.append(hitbox, marker);
      });
    };

    const animateXpTo = (target) => {
      const clamped = Math.max(0, Math.min(state.xpTotal, target));
      state.xpCurrent = clamped;
      const percent = (clamped / state.xpTotal) * 100;
      xpFill.style.width = `${percent}%`;
      xpText.textContent = `${clamped} / ${state.xpTotal} XP`;
    };

    const showToast = (text) => {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1450);
    };

    const onBuildingTap = (entry) => {
      if (entry.type === 'lab') {
        console.log('Lab Scene opened:', entry.id);
        animateXpTo(470);
        showToast('Laboratory tapped — opening Lab Scene...');
        return;
      }

      if (entry.type === 'road_exit') {
        console.log('Road exit tapped:', entry.id);
        showToast('Road Exit tapped — world travel soon.');
        return;
      }

      console.log('House tapped:', entry.id);
      animateXpTo(Math.min(state.xpTotal, state.xpCurrent + 10));
      showToast(`House interaction: ${entry.label}`);
    };

    const triggerScan = () => {
      const rect = gameRoot.getBoundingClientRect();
      const centerX = rect.width * 0.5;
      const centerY = rect.height * 0.56;
      scanRing.style.left = `${centerX}px`;
      scanRing.style.top = `${centerY}px`;
      scanRing.classList.remove('active');
      void scanRing.offsetWidth;
      scanRing.classList.add('active');
      showToast('Search Mode: scanning for creatures...');
      console.log('Search mode placeholder activated');
    };

    const setActiveNav = (target) => {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.nav === target);
      });
    };

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.nav !== 'menu') {
          setActiveNav(btn.dataset.nav);
          menuPanel.classList.remove('open');
        }
      });
    });

    menuBtn.addEventListener('click', () => {
      menuPanel.classList.toggle('open');
      setActiveNav('menu');
    });

    searchBtn.addEventListener('click', () => {
      state.searchMode = true;
      triggerScan();
    });

    window.addEventListener('resize', () => {
      window.requestAnimationFrame(setCssVarsForScale);
    }, { passive: true });

    animateXpTo(state.xpCurrent);
    setCssVarsForScale();
  </script>
</body>
</html>
