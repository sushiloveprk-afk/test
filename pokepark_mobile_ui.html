<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PokePark Mobile World</title>
  <style>
    :root {
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --panel: rgba(8, 12, 18, 0.84);
      --panel-strong: rgba(5, 8, 14, 0.95);
      --panel-border: rgba(146, 183, 255, 0.26);
      --accent: #41b3ff;
      --accent-soft: #76d4ff;
      --text: #f3f8ff;
      --muted: #a8bdd8;
      --shadow: 0 20px 36px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 14px 34px rgba(4, 10, 22, 0.4);
      --ring: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", system-ui, -apple-system, sans-serif;
      background: #03060b;
      color: var(--text);
      user-select: none;
    }

    .game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f1826, #020306 60%);
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d1017;
      isolation: isolate;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-position: center;
      background-size: cover;
      transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 320ms ease;
      transform: scale(1.01);
      z-index: 1;
    }

    .scene-bg.travel { animation: travelPulse 580ms ease; }

    .scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(5, 9, 14, 0.08) 34%, rgba(0, 0, 0, 0.58) 100%);
      pointer-events: none;
    }

    .scene-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 16%, rgba(101, 179, 255, 0.2), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    .transition-fade {
      position: absolute;
      inset: 0;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(9, 16, 30, 0.55), rgba(2, 5, 10, 0.95));
      transition: opacity 260ms ease;
    }

    .transition-fade.active { opacity: 1; }

    .hitboxes,
    .hud,
    .dialogs,
    .menu-overlay {
      position: absolute;
      inset: 0;
    }

    .hitboxes { z-index: 3; }
    .hud { z-index: 4; pointer-events: none; }
    .dialogs { z-index: 8; pointer-events: none; }
    .menu-overlay { z-index: 7; pointer-events: none; }

    .hotspot {
      position: absolute;
      border: 0;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
    }

    .hotspot:active { transform: scale(0.98); }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(5px);
      animation: floatY 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    .marker.home { background: rgba(80, 140, 255, 0.72); }
    .marker.lab { background: rgba(77, 228, 255, 0.78); }
    .marker.exit { background: rgba(255, 163, 66, 0.82); }
    .marker.npc { background: rgba(170, 104, 255, 0.85); }

    .top-hud {
      position: absolute;
      top: var(--safe-top);
      left: 12px;
      right: 12px;
      display: flex;
      gap: 10px;
      align-items: stretch;
      pointer-events: auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: var(--ring), var(--shadow);
    }

    .profile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      min-width: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: radial-gradient(circle at 35% 20%, #3e96ff, #0a2242);
      border: 2px solid rgba(129, 197, 255, 0.72);
      flex-shrink: 0;
    }

    .level { font-size: 30px; font-weight: 800; line-height: 1; }

    .xp {
      margin-top: 5px;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(17, 24, 37, 0.9);
      border: 1px solid rgba(160, 198, 255, 0.35);
      position: relative;
    }

    .xp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 45%;
      background: linear-gradient(90deg, #2f95ff, #54f0ba);
      transition: width 360ms ease;
    }

    .xp-text {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .currencies {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      font-weight: 700;
      white-space: nowrap;
      font-size: 21px;
    }

    .actions {
      position: absolute;
      top: calc(var(--safe-top) + 82px);
      right: 12px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      transition: transform 180ms ease, box-shadow 220ms ease, background 180ms ease;
      box-shadow: var(--ring), var(--shadow-soft);
    }

    .icon-btn:hover { transform: translateY(-2px); background: rgba(29, 48, 82, 0.9); }

    .badge {
      position: absolute;
      top: -5px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #ff4040;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      padding: 0 5px;
    }

    .bottom-nav {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: var(--safe-bottom);
      padding: 8px;
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      pointer-events: auto;
    }

    .nav-btn {
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #e4edff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 180ms ease, background 220ms ease, box-shadow 220ms ease;
    }

    .nav-btn.active {
      background: linear-gradient(150deg, rgba(40, 123, 255, 0.44), rgba(55, 215, 255, 0.24));
      box-shadow: inset 0 0 0 1px rgba(151, 226, 255, 0.7);
    }

    .nav-btn:active { transform: scale(0.96); }

    .scene-character {
      position: absolute;
      z-index: 5;
      left: 56%;
      bottom: 22%;
      width: min(24vw, 220px);
      aspect-ratio: 1 / 1.1;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, 24px, 0) scale(0.94);
      transition: opacity 320ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 24px 24px rgba(0, 0, 0, 0.55));
    }

    .scene-character.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      animation: floatCharacter 2.4s ease-in-out infinite;
    }

    .scene-character::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 10%, #fff9 6%, transparent 28%),
        linear-gradient(180deg, #92e5ff, #3d6ed7 45%, #2d335d 100%);
      border: 1px solid rgba(155, 226, 255, 0.65);
      box-shadow: inset 0 0 18px rgba(180, 236, 255, 0.5), 0 24px 32px rgba(0, 0, 0, 0.45);
    }

    .scene-character::after {
      content: '👨‍🔬 Профессор';
      position: absolute;
      left: 50%;
      bottom: -36px;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ebf8ff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    @keyframes floatCharacter {
      50% { transform: translate3d(-50%, -8px, 0) scale(1.01); }
    }

    .nav-icon { font-size: 20px; }

    .menu-overlay.open {
      background: rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: -320px;
      width: min(320px, 84vw);
      height: 100%;
      background: linear-gradient(180deg, rgba(8, 13, 20, 0.97), rgba(10, 15, 26, 0.97));
      border-left: 1px solid rgba(144, 184, 255, 0.25);
      padding: calc(var(--safe-top) + 10px) 14px 14px;
      transition: right 320ms cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .menu-overlay.open .menu-panel { right: 0; }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .close-btn {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(115, 145, 201, 0.2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .menu-item {
      border: 1px solid rgba(143, 184, 255, 0.24);
      border-radius: 14px;
      background: rgba(66, 101, 167, 0.12);
      padding: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 88px);
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(7, 12, 20, 0.92);
      border: 1px solid rgba(149, 199, 255, 0.36);
      font-size: 13px;
      opacity: 0;
      transition: opacity 180ms ease, transform 260ms ease;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translate(-50%, -6px); }

    .dialog-wrap.show { pointer-events: auto; }

    .dialog-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: end center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .dialog-wrap.show { opacity: 1; }

    .dialog {
      width: min(700px, 100%);
      background: linear-gradient(160deg, rgba(11, 19, 31, 0.97), rgba(11, 15, 23, 0.97));
      border: 1px solid rgba(131, 177, 255, 0.35);
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transform: translateY(12px) scale(0.98);
      transition: transform 240ms ease;
    }

    .dialog-wrap.show .dialog { transform: translateY(0) scale(1); }

    .npc-avatar {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: url('http://castles-vk.ru/pokepark/img/nps/1.png') center / cover no-repeat;
      border: 1px solid rgba(168, 214, 255, 0.5);
      flex-shrink: 0;
    }

    .dialog h3 { margin: 0 0 6px; }
    .dialog p { margin: 0; color: #d6e4f8; font-size: 14px; line-height: 1.4; }

    .dialog-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dialog-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .dialog-btn.primary { background: var(--accent); color: #031120; }
    .dialog-btn.secondary { background: rgba(130, 164, 224, 0.2); color: #f2f7ff; }

    @keyframes floatY {
      50% { transform: translate(-50%, calc(-50% - 3px)); }
    }

    @keyframes travelPulse {
      0% { filter: brightness(1); transform: scale(1.01); }
      50% { filter: brightness(1.13); transform: scale(1.025); }
      100% { filter: brightness(1); transform: scale(1.01); }
    }

    @media (max-width: 420px) {
      .level { font-size: 24px; }
      .currencies { font-size: 18px; }
      .avatar { width: 48px; height: 48px; font-size: 24px; }
      .top-hud { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="viewport" id="gameRoot">
      <section class="scene-bg" id="sceneBg"></section>
      <section class="scene-overlay"></section>
      <div class="transition-fade" id="transitionFade"></div>
      <div class="scene-character" id="sceneCharacter" aria-hidden="true"></div>
      <section class="hitboxes" id="hitboxes"></section>

      <section class="hud">
        <header class="top-hud">
          <div class="panel profile">
            <div class="avatar">🧢</div>
            <div style="min-width:0;flex:1;">
              <div class="level">Lv. 5</div>
              <div class="xp"><div class="xp-fill" id="xpFill"></div></div>
              <div class="xp-text" id="xpText">450 / 1000 XP</div>
            </div>
          </div>

          <div class="panel currencies">
            <span>🪙 12,500</span>
            <span>💎 250</span>
          </div>
        </header>

        <div class="actions">
          <button class="icon-btn" aria-label="Mail">✉️<span class="badge">3</span></button>
          <button class="icon-btn" aria-label="Notifications">🔔<span class="badge">1</span></button>
          <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
        </div>

        <div class="panel bottom-nav">
          <button class="nav-btn active" data-nav="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-btn" data-nav="world"><span class="nav-icon">🗺️</span>World</button>
          <button class="nav-btn" id="searchBtn" data-nav="search"><span class="nav-icon">⌕</span>Search</button>
          <button class="nav-btn" data-nav="bag"><span class="nav-icon">👜</span>Bag</button>
          <button class="nav-btn" data-nav="menu"><span class="nav-icon">☰</span>Menu</button>
        </div>

        <div id="toast" class="toast"></div>
      </section>

      <section class="menu-overlay" id="menuOverlay">
        <aside class="menu-panel">
          <div class="menu-head">
            <h3 style="margin:0;">Меню</h3>
            <button class="close-btn" id="closeMenu">✕</button>
          </div>
          <div class="menu-item">Профиль</div>
          <div class="menu-item">Покедекс</div>
          <div class="menu-item">Квесты</div>
          <div class="menu-item">Инвентарь</div>
          <div class="menu-item">Настройки</div>
        </aside>
      </section>

      <section class="dialogs">
        <div class="dialog-wrap" id="npcDialog">
          <article class="dialog">
            <div class="npc-avatar"></div>
            <div>
              <h3>Профессор</h3>
              <p>Добро пожаловать в лабораторию! Здесь ты узнаешь о мире, героях и путешествиях. Готов начать приключение?</p>
              <div class="dialog-actions">
                <button class="dialog-btn primary" id="dialogTalk">Поговорить</button>
                <button class="dialog-btn secondary" id="dialogClose">Закрыть</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 1920;
    const DESIGN_HEIGHT = 1080;

    const scenes = {
      main: {
        bg: 'http://castles-vk.ru/pokepark/img/location/1.png',
        hotspots: [
          { id: 'lab', x: 760, y: 330, width: 420, height: 360, marker: '🧪', markerClass: 'lab', markerX: 980, markerY: 350, action: { type: 'scene', to: 'lab-entry', toast: 'Переход в лабораторию...' } },
          { id: 'house-a', x: 280, y: 300, width: 320, height: 320, marker: '⌂', markerClass: 'home', markerX: 430, markerY: 300, action: { type: 'scene', to: 'house-6', toast: 'Входим в дом №1' } },
          { id: 'house-b', x: 1160, y: 350, width: 300, height: 300, marker: '⌂', markerClass: 'home', markerX: 1300, markerY: 330, action: { type: 'scene', to: 'house-4', toast: 'Входим в дом №2' } },
          { id: 'house-c', x: 1190, y: 680, width: 340, height: 300, marker: '⌂', markerClass: 'home', markerX: 1360, markerY: 670, action: { type: 'scene', to: 'house-5', toast: 'Входим в дом №3' } }
        ]
      },
      'house-6': {
        bg: 'https://castles-vk.ru/pokepark/img/location/6.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'house-4': {
        bg: 'https://castles-vk.ru/pokepark/img/location/4.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'house-5': {
        bg: 'https://castles-vk.ru/pokepark/img/location/5.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'lab-entry': {
        bg: 'http://castles-vk.ru/pokepark/img/location/2.png',
        hotspots: [
          { id: 'to-city-lab', x: 820, y: 360, width: 300, height: 350, marker: '🧬', markerClass: 'lab', markerX: 970, markerY: 330, action: { type: 'scene', to: 'lab-city', toast: 'Переход в городскую лабораторию...' } },
          { id: 'exit-to-main', x: 40, y: 380, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 170, markerY: 350, action: { type: 'scene', to: 'main', toast: 'Возврат на главную локацию' } }
        ]
      },
      'lab-city': {
        bg: 'http://castles-vk.ru/pokepark/img/location/3.png',
        hotspots: [
          { id: 'npc-professor', x: 875, y: 390, width: 220, height: 430, marker: 'NPC', markerClass: 'npc', markerX: 995, markerY: 370, action: { type: 'dialog', toast: 'Профессор готов к разговору' } },
          { id: 'exit-lab-city', x: 32, y: 390, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 165, markerY: 360, action: { type: 'scene', to: 'main', toast: 'Вы покинули лабораторию' } }
        ]
      }
    };

    const sceneBg = document.getElementById('sceneBg');
    const hitboxes = document.getElementById('hitboxes');
    const transitionFade = document.getElementById('transitionFade');
    const sceneCharacter = document.getElementById('sceneCharacter');
    const toast = document.getElementById('toast');
    const xpFill = document.getElementById('xpFill');
    const xpText = document.getElementById('xpText');
    const gameRoot = document.getElementById('gameRoot');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuBtn = document.getElementById('menuBtn');
    const closeMenu = document.getElementById('closeMenu');
    const searchBtn = document.getElementById('searchBtn');
    const npcDialog = document.getElementById('npcDialog');
    const dialogClose = document.getElementById('dialogClose');
    const dialogTalk = document.getElementById('dialogTalk');

    const state = {
      scene: 'main',
      xpCurrent: 450,
      xpTotal: 1000,
      toastTimer: null
    };

    const showToast = (text) => {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    };

    const setActiveNav = (target) => {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.nav === target);
      });
    };

    const animateXpTo = (target) => {
      const value = Math.max(0, Math.min(state.xpTotal, target));
      state.xpCurrent = value;
      xpFill.style.width = `${(value / state.xpTotal) * 100}%`;
      xpText.textContent = `${value} / ${state.xpTotal} XP`;
    };


    const updateSceneCharacter = (sceneId) => {
      const show = sceneId === 'lab-city';
      sceneCharacter.classList.toggle('show', show);
    };

    const setScene = (sceneId) => {
      if (!scenes[sceneId]) return;
      state.scene = sceneId;
      sceneBg.style.backgroundImage = `url('${scenes[sceneId].bg}')`;
      sceneBg.classList.remove('travel');
      void sceneBg.offsetWidth;
      sceneBg.classList.add('travel');
      npcDialog.classList.remove('show');
      updateSceneCharacter(sceneId);
      renderHotspots();
    };

    const actionByHotspot = (spot) => {
      if (!spot.action) return;
      if (spot.action.toast) showToast(spot.action.toast);

      if (spot.action.type === 'scene') {
        animateXpTo(state.xpCurrent + 8);
        transitionFade.classList.add('active');
        setTimeout(() => setScene(spot.action.to), 140);
        setTimeout(() => transitionFade.classList.remove('active'), 320);
      }

      if (spot.action.type === 'dialog') {
        npcDialog.classList.add('show');
      }
    };

    const renderHotspots = () => {
      const current = scenes[state.scene];
      if (!current) return;

      const rect = gameRoot.getBoundingClientRect();
      const sx = rect.width / DESIGN_WIDTH;
      const sy = rect.height / DESIGN_HEIGHT;
      hitboxes.innerHTML = '';

      current.hotspots.forEach((spot) => {
        const button = document.createElement('button');
        button.className = 'hotspot';
        button.style.left = `${spot.x * sx}px`;
        button.style.top = `${spot.y * sy}px`;
        button.style.width = `${spot.width * sx}px`;
        button.style.height = `${spot.height * sy}px`;
        button.ariaLabel = spot.id;
        button.addEventListener('click', () => actionByHotspot(spot));

        const marker = document.createElement('div');
        marker.className = `marker ${spot.markerClass}`;
        marker.style.left = `${spot.markerX * sx}px`;
        marker.style.top = `${spot.markerY * sy}px`;
        marker.textContent = spot.marker;

        hitboxes.append(button, marker);
      });
    };

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const nav = btn.dataset.nav;
        setActiveNav(nav);
        if (nav === 'menu') {
          menuOverlay.classList.add('open');
        } else {
          menuOverlay.classList.remove('open');
        }
      });
    });

    searchBtn.addEventListener('click', () => {
      showToast('Сканирование мира...');
      animateXpTo(state.xpCurrent + 12);
    });

    menuBtn.addEventListener('click', () => {
      menuOverlay.classList.add('open');
      setActiveNav('menu');
    });

    closeMenu.addEventListener('click', () => {
      menuOverlay.classList.remove('open');
      setActiveNav('home');
    });

    menuOverlay.addEventListener('click', (event) => {
      if (event.target === menuOverlay) {
        menuOverlay.classList.remove('open');
        setActiveNav('home');
      }
    });

    dialogClose.addEventListener('click', () => npcDialog.classList.remove('show'));
    dialogTalk.addEventListener('click', () => showToast('Профессор рассказал о мире и квестах.'));

    window.addEventListener('resize', () => window.requestAnimationFrame(renderHotspots), { passive: true });

    setScene('main');
    updateSceneCharacter('main');
    animateXpTo(state.xpCurrent);
  </script>
</body>
</html>
