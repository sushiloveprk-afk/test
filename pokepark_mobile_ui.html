<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PokePark — Mobile World UI</title>
  <style>
    :root{
      --safe-top:max(12px, env(safe-area-inset-top));
      --safe-bottom:max(14px, env(safe-area-inset-bottom));
      --glass:rgba(255,255,255,.22);
      --glass-strong:rgba(255,255,255,.3);
      --ink:#11324f;
      --muted:#e7f4ff;
      --accent:#58b6ff;
      --accent-2:#8be9ff;
      --xp:#6cf57d;
      --shadow:0 12px 36px rgba(9,24,47,.28);
      --radius:22px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#cce8ff;color:white;overflow:hidden}

    .app{height:100%;position:relative;overflow:hidden;isolation:isolate}
    .scene{
      position:absolute;inset:0;
      background-size:cover;background-position:center;
      opacity:0;transform:scale(1.03);
      transition:opacity .45s ease, transform .45s ease, filter .4s ease;
      filter:saturate(1.03);
    }
    .scene.active{opacity:1;transform:scale(1)}

    .env{
      position:absolute;inset:0;pointer-events:none;z-index:1;
      background:
        radial-gradient(200px 130px at 20% 16%, rgba(255,255,255,.2), transparent 70%),
        radial-gradient(140px 90px at 73% 24%, rgba(255,255,255,.17), transparent 70%);
      animation:ambient 7s ease-in-out infinite;
    }
    .env::before,.env::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(1px);animation:float 5.5s ease-in-out infinite}
    .env::before{width:8px;height:8px;left:16%;top:56%}
    .env::after{width:6px;height:6px;left:70%;top:66%;animation-delay:1.3s}

    .topbar{
      position:absolute;left:12px;right:12px;top:var(--safe-top);z-index:10;
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.35);
      background:linear-gradient(180deg,var(--glass-strong),var(--glass));
      backdrop-filter:blur(9px);box-shadow:var(--shadow);
    }
    .avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(160deg,#ffe7b9,#ffaf85);display:grid;place-items:center;font-size:21px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
    .trainer{min-width:0;display:grid;gap:4px;flex:1}
    .trainer b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .level{font-size:11px;opacity:.9}
    .xp{height:9px;background:rgba(255,255,255,.35);border-radius:99px;overflow:hidden;position:relative}
    .xpFill{height:100%;width:33%;border-radius:99px;background:linear-gradient(90deg,#87ff8a,var(--xp));box-shadow:0 0 12px rgba(127,255,139,.9);transition:width .45s cubic-bezier(.2,.9,.2,1)}

    .hotspots{position:absolute;inset:0;z-index:3}
    .hotspot{
      position:absolute;border-radius:18px;cursor:pointer;
      border:1px solid transparent;
      transition:transform .2s ease, filter .2s ease, box-shadow .25s ease;
      animation:pulseHint 3.8s ease-in-out infinite;
    }
    .hotspot::after{content:"";position:absolute;inset:-2px;border-radius:inherit;background:radial-gradient(circle at 50% 40%, rgba(170,231,255,.22), transparent 70%);opacity:.5}
    .hotspot:hover,.hotspot:active{transform:scale(1.02);filter:brightness(1.09);box-shadow:0 0 18px rgba(130,218,255,.45)}
    .house1{left:9%;top:48%;width:21%;height:21%}
    .house2{left:63%;top:52%;width:20%;height:20%;animation-delay:.7s}
    .house3{left:33%;top:61%;width:17%;height:17%;animation-delay:1.2s}
    .lab{left:41%;top:35%;width:24%;height:24%;animation-delay:.4s}

    .door{position:absolute;left:44%;bottom:18%;width:12%;height:20%;z-index:4;border-radius:16px;cursor:pointer;animation:pulseHint 3.2s ease-in-out infinite}
    .door:hover,.door:active{filter:brightness(1.1);box-shadow:0 0 20px rgba(159,234,255,.6)}
    .doorTap{animation:tapBounce .25s ease}

    .professor{position:absolute;left:56%;bottom:22%;width:26%;z-index:4;cursor:pointer;transform-origin:bottom center;transition:transform .2s ease, filter .2s ease;filter:drop-shadow(0 8px 20px rgba(0,0,0,.42))}
    .professor:hover,.professor:active{transform:scale(1.02);filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)) brightness(1.06)}

    .bottomBar{
      position:absolute;left:10px;right:10px;bottom:var(--safe-bottom);z-index:11;
      display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
      border-radius:24px;border:1px solid rgba(255,255,255,.36);
      background:linear-gradient(180deg,var(--glass-strong),var(--glass));
      backdrop-filter:blur(10px);padding:10px 8px;box-shadow:var(--shadow);
    }
    .iconBtn{border:0;background:transparent;color:white;display:grid;gap:4px;justify-items:center;font-size:10px;font-weight:700;cursor:pointer}
    .iconWrap{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.33)}
    .iconBtn:active .iconWrap{animation:tapBounce .25s ease}

    .menuPanel{
      position:absolute;left:0;right:0;bottom:-62%;z-index:13;
      border-radius:28px 28px 0 0;padding:16px 14px calc(16px + var(--safe-bottom));
      background:linear-gradient(180deg,rgba(23,64,106,.93),rgba(13,44,78,.93));
      border-top:1px solid rgba(255,255,255,.2);transition:bottom .35s cubic-bezier(.2,.9,.2,1);
      box-shadow:0 -14px 32px rgba(3,11,24,.4);
    }
    .menuPanel.open{bottom:0}
    .menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
    .menuItem{border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;background:rgba(255,255,255,.08);font-weight:700}

    .dialogue{
      position:absolute;left:10px;right:10px;bottom:86px;z-index:14;
      border-radius:20px;padding:10px;
      background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(232,245,255,.94));
      color:var(--ink);display:none;gap:10px;box-shadow:var(--shadow);
    }
    .dialogue.show{display:grid;grid-template-columns:66px 1fr}
    .portrait{width:66px;height:66px;border-radius:16px;object-fit:cover;box-shadow:0 8px 16px rgba(21,48,77,.2)}
    .bubble{background:white;border-radius:16px;padding:10px;border:1px solid #d8ebff;min-height:66px}
    .line{font-size:13px;line-height:1.34;min-height:44px}
    .actions{display:flex;gap:8px;margin-top:8px}
    .actions button{flex:1;border:0;border-radius:12px;padding:9px 8px;font-weight:700;cursor:pointer}
    .next{background:linear-gradient(180deg,#5fbfff,#339fff);color:white}

    .sceneLabel{position:absolute;left:12px;bottom:94px;z-index:8;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:rgba(8,27,52,.55);border:1px solid rgba(255,255,255,.22)}

    @keyframes tapBounce{0%{transform:scale(1)}45%{transform:scale(.92)}100%{transform:scale(1)}}
    @keyframes pulseHint{0%,100%{box-shadow:0 0 0 rgba(136,220,255,.2)}50%{box-shadow:0 0 18px rgba(136,220,255,.38)}}
    @keyframes ambient{50%{transform:translateY(-3px)}}
    @keyframes float{50%{transform:translateY(-8px);opacity:.7}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="scene active" id="world" style="background-image:url('http://castles-vk.ru/pokepark/img/location/1.png')"></section>
    <section class="scene" id="house" style="background-image:url('http://castles-vk.ru/pokepark/img/location/2.png')"></section>
    <section class="scene" id="lab" style="background-image:url('http://castles-vk.ru/pokepark/img/location/3.png')"></section>

    <div class="env"></div>

    <header class="topbar">
      <div class="avatar">🧢</div>
      <div class="trainer">
        <b>Trainer: Alex</b>
        <div class="level">Level 5</div>
        <div class="xp"><div id="xpFill" class="xpFill"></div></div>
      </div>
    </header>

    <div class="sceneLabel" id="sceneLabel">Village</div>

    <div class="hotspots" id="worldHotspots">
      <button class="hotspot house1" data-target="house" aria-label="Enter house"></button>
      <button class="hotspot house2" data-target="house" aria-label="Enter house"></button>
      <button class="hotspot house3" data-target="house" aria-label="Enter house"></button>
      <button class="hotspot lab" data-target="lab" aria-label="Enter laboratory"></button>
    </div>

    <button class="door" id="houseDoor" aria-label="Exit house" hidden></button>
    <button class="door" id="labDoor" aria-label="Exit lab" hidden></button>

    <img id="professor" class="professor" src="http://castles-vk.ru/pokepark/img/nps/1.png" alt="Professor" hidden>

    <section class="dialogue" id="dialogue">
      <img class="portrait" src="http://castles-vk.ru/pokepark/img/nps/1.png" alt="Professor portrait" />
      <div class="bubble">
        <div class="line" id="dialogueLine"></div>
        <div class="actions">
          <button class="next" id="nextLine">Continue</button>
          <button id="closeDialogue">Close</button>
        </div>
      </div>
    </section>

    <aside class="menuPanel" id="menuPanel">
      <strong>Main Menu</strong>
      <div class="menuGrid">
        <div class="menuItem">Settings</div>
        <div class="menuItem">Friends</div>
        <div class="menuItem">VIP Shop</div>
        <div class="menuItem">Events</div>
        <div class="menuItem">Achievements</div>
        <div class="menuItem">Help</div>
      </div>
    </aside>

    <nav class="bottomBar">
      <button class="iconBtn" aria-label="Inventory"><span class="iconWrap">🎒</span>Inventory</button>
      <button class="iconBtn" aria-label="World Map" id="toWorld"><span class="iconWrap">🗺️</span>Map</button>
      <button class="iconBtn" aria-label="Search"><span class="iconWrap">🔎</span>Search</button>
      <button class="iconBtn" aria-label="Chat"><span class="iconWrap">💬</span>Chat</button>
      <button class="iconBtn" aria-label="Menu" id="menuBtn"><span class="iconWrap">☰</span>Menu</button>
    </nav>
  </main>

  <script>
    const scenes = {
      world: document.getElementById('world'),
      house: document.getElementById('house'),
      lab: document.getElementById('lab')
    };

    const state = {
      scene: 'world',
      xp: 33,
      dialogueIdx: 0,
      typing: null,
      dialogue: [
        'Welcome to PokePark! This village is your home base.',
        'Explore the world, meet creatures, and learn their habitats.',
        'Use your search tools to encounter monsters and catch them.',
        'Build your team, gain experience, and begin your adventure!'
      ]
    };

    const sceneLabel = document.getElementById('sceneLabel');
    const worldHotspots = document.getElementById('worldHotspots');
    const houseDoor = document.getElementById('houseDoor');
    const labDoor = document.getElementById('labDoor');
    const professor = document.getElementById('professor');
    const xpFill = document.getElementById('xpFill');

    const dialogue = document.getElementById('dialogue');
    const dialogueLine = document.getElementById('dialogueLine');
    const nextLine = document.getElementById('nextLine');
    const closeDialogue = document.getElementById('closeDialogue');

    const menuPanel = document.getElementById('menuPanel');
    const menuBtn = document.getElementById('menuBtn');

    function setScene(name){
      Object.values(scenes).forEach(s => s.classList.remove('active'));
      scenes[name].classList.add('active');
      state.scene = name;
      worldHotspots.hidden = name !== 'world';
      houseDoor.hidden = name !== 'house';
      labDoor.hidden = name !== 'lab';
      professor.hidden = name !== 'lab';
      dialogue.classList.remove('show');

      sceneLabel.textContent = name === 'world' ? 'Village' : name === 'house' ? 'House Interior' : 'Professor Laboratory';
      animateXp(name === 'lab' ? 48 : name === 'house' ? 40 : 33);
    }

    function animateXp(target){
      state.xp = target;
      xpFill.style.width = `${target}%`;
    }

    function tapDoor(el){
      el.classList.remove('doorTap');
      void el.offsetWidth;
      el.classList.add('doorTap');
      setTimeout(() => setScene('world'), 140);
    }

    document.querySelectorAll('.hotspot').forEach(h => {
      h.addEventListener('click', () => setScene(h.dataset.target));
    });

    houseDoor.addEventListener('click', () => tapDoor(houseDoor));
    labDoor.addEventListener('click', () => tapDoor(labDoor));
    document.getElementById('toWorld').addEventListener('click', () => setScene('world'));

    function typeLine(text){
      clearInterval(state.typing);
      dialogueLine.textContent = '';
      let i = 0;
      state.typing = setInterval(() => {
        dialogueLine.textContent += text[i++] || '';
        if (i > text.length) clearInterval(state.typing);
      }, 24);
    }

    professor.addEventListener('click', () => {
      state.dialogueIdx = 0;
      dialogue.classList.add('show');
      typeLine(state.dialogue[state.dialogueIdx]);
    });

    nextLine.addEventListener('click', () => {
      state.dialogueIdx = (state.dialogueIdx + 1) % state.dialogue.length;
      typeLine(state.dialogue[state.dialogueIdx]);
    });

    closeDialogue.addEventListener('click', () => {
      dialogue.classList.remove('show');
      clearInterval(state.typing);
    });

    menuBtn.addEventListener('click', () => menuPanel.classList.toggle('open'));

    setScene('world');
  </script>
</body>
</html>
