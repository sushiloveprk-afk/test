<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PokePark Mobile World</title>
  <style>
    :root {
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --panel: rgba(8, 12, 18, 0.84);
      --panel-strong: rgba(5, 8, 14, 0.95);
      --panel-border: rgba(146, 183, 255, 0.26);
      --accent: #41b3ff;
      --accent-soft: #76d4ff;
      --text: #f3f8ff;
      --muted: #a8bdd8;
      --shadow: 0 20px 36px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 14px 34px rgba(4, 10, 22, 0.4);
      --ring: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, "SF Pro Display", system-ui, -apple-system, sans-serif;
      background: #03060b;
      color: var(--text);
      user-select: none;
    }

    .game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f1826, #020306 60%);
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d1017;
      isolation: isolate;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-position: center;
      background-size: cover;
      transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 320ms ease;
      transform: scale(1.01);
      z-index: 1;
    }

    .scene-bg.travel { animation: travelPulse 580ms ease; }

    .scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(5, 9, 14, 0.08) 34%, rgba(0, 0, 0, 0.58) 100%);
      pointer-events: none;
    }

    .scene-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 16%, rgba(101, 179, 255, 0.2), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    .transition-fade {
      position: absolute;
      inset: 0;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(9, 16, 30, 0.55), rgba(2, 5, 10, 0.95));
      transition: opacity 260ms ease;
    }

    .transition-fade.active { opacity: 1; }

    .hitboxes,
    .hud,
    .dialogs,
    .menu-overlay {
      position: absolute;
      inset: 0;
    }

    .hitboxes { z-index: 3; }
    .hud { z-index: 4; pointer-events: none; }
    .dialogs { z-index: 8; pointer-events: none; }
    .menu-overlay { z-index: 7; pointer-events: none; }

    .hotspot {
      position: absolute;
      border: 0;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
    }

    .hotspot:active { transform: scale(0.98); }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 44px;
      height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(5px);
      animation: floatY 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    .marker.home { background: rgba(80, 140, 255, 0.72); }
    .marker.lab { background: rgba(77, 228, 255, 0.78); }
    .marker.exit { background: rgba(255, 163, 66, 0.82); }
    .marker.npc { background: rgba(170, 104, 255, 0.85); }

    .top-hud {
      position: absolute;
      top: var(--safe-top);
      left: 12px;
      right: 12px;
      display: flex;
      gap: 10px;
      align-items: stretch;
      pointer-events: auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: var(--ring), var(--shadow);
    }

    .profile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      min-width: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: radial-gradient(circle at 35% 20%, #3e96ff, #0a2242);
      border: 2px solid rgba(129, 197, 255, 0.72);
      flex-shrink: 0;
    }

    .level { font-size: 30px; font-weight: 800; line-height: 1; }

    .xp {
      margin-top: 5px;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(17, 24, 37, 0.9);
      border: 1px solid rgba(160, 198, 255, 0.35);
      position: relative;
    }

    .xp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 45%;
      background: linear-gradient(90deg, #2f95ff, #54f0ba);
      transition: width 360ms ease;
    }

    .xp-text {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .currencies {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      font-weight: 700;
      white-space: nowrap;
      font-size: 21px;
    }

    .actions {
      position: absolute;
      top: calc(var(--safe-top) + 82px);
      right: 12px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      position: relative;
      transition: transform 180ms ease, box-shadow 220ms ease, background 180ms ease;
      box-shadow: var(--ring), var(--shadow-soft);
    }

    .icon-btn:hover { transform: translateY(-2px); background: rgba(29, 48, 82, 0.9); }

    .badge {
      position: absolute;
      top: -5px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #ff4040;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      padding: 0 5px;
    }

    .bottom-nav {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: var(--safe-bottom);
      padding: 8px;
      border-radius: 22px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      pointer-events: auto;
    }

    .nav-btn {
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #e4edff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 180ms ease, background 220ms ease, box-shadow 220ms ease;
    }

    .nav-btn.active {
      background: linear-gradient(150deg, rgba(40, 123, 255, 0.44), rgba(55, 215, 255, 0.24));
      box-shadow: inset 0 0 0 1px rgba(151, 226, 255, 0.7);
    }

    .nav-btn:active { transform: scale(0.96); }

    .scene-character {
      position: absolute;
      z-index: 5;
      left: 56%;
      bottom: 22%;
      width: min(24vw, 220px);
      aspect-ratio: 1 / 1.1;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, 24px, 0) scale(0.94);
      transition: opacity 320ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 24px 24px rgba(0, 0, 0, 0.55));
    }

    .scene-character.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0) scale(1);
      animation: floatCharacter 2.4s ease-in-out infinite;
    }

    .scene-character::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 10%, #fff9 6%, transparent 28%),
        linear-gradient(180deg, #92e5ff, #3d6ed7 45%, #2d335d 100%);
      border: 1px solid rgba(155, 226, 255, 0.65);
      box-shadow: inset 0 0 18px rgba(180, 236, 255, 0.5), 0 24px 32px rgba(0, 0, 0, 0.45);
    }

    .scene-character::after {
      content: '👨‍🔬 Профессор';
      position: absolute;
      left: 50%;
      bottom: -36px;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ebf8ff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    @keyframes floatCharacter {
      50% { transform: translate3d(-50%, -8px, 0) scale(1.01); }
    }

    .nav-icon { font-size: 20px; }

    .menu-overlay.open {
      background: rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .menu-panel {
      position: absolute;
      top: 0;
      right: -320px;
      width: min(320px, 84vw);
      height: 100%;
      background: linear-gradient(180deg, rgba(8, 13, 20, 0.97), rgba(10, 15, 26, 0.97));
      border-left: 1px solid rgba(144, 184, 255, 0.25);
      padding: calc(var(--safe-top) + 10px) 14px 14px;
      transition: right 320ms cubic-bezier(0.2, 0.9, 0.2, 1);
    }

    .menu-overlay.open .menu-panel { right: 0; }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .close-btn {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(115, 145, 201, 0.2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .menu-item {
      border: 1px solid rgba(143, 184, 255, 0.24);
      border-radius: 14px;
      background: rgba(66, 101, 167, 0.12);
      padding: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 88px);
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(7, 12, 20, 0.92);
      border: 1px solid rgba(149, 199, 255, 0.36);
      font-size: 13px;
      opacity: 0;
      transition: opacity 180ms ease, transform 260ms ease;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translate(-50%, -6px); }

    .dialog-wrap.show { pointer-events: auto; }

    .dialog-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: end center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .dialog-wrap.show { opacity: 1; }

    .dialog {
      width: min(760px, 100%);
      background: linear-gradient(160deg, rgba(11, 19, 31, 0.98), rgba(11, 15, 23, 0.98));
      border: 1px solid rgba(131, 177, 255, 0.35);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(12px) scale(0.98);
      transition: transform 240ms ease;
    }

    .dialog-wrap.show .dialog { transform: translateY(0) scale(1); }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dialog-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .npc-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: url('http://castles-vk.ru/pokepark/img/nps/1.png') center top / 155% no-repeat;
      border: 1px solid rgba(168, 214, 255, 0.65);
      flex-shrink: 0;
      box-shadow: inset 0 0 20px rgba(7, 12, 19, 0.5);
    }

    .chat-feed {
      max-height: 42vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .chat-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-row.you {
      justify-content: flex-end;
    }

    .chat-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
      background: rgba(120, 172, 255, 0.26);
      border: 1px solid rgba(154, 204, 255, 0.5);
    }

    .chat-icon.you {
      background: rgba(125, 245, 209, 0.24);
      border-color: rgba(145, 240, 220, 0.56);
    }

    .chat-bubble {
      max-width: min(78%, 430px);
      border-radius: 14px;
      padding: 9px 11px;
      font-size: 14px;
      line-height: 1.38;
      background: rgba(83, 132, 220, 0.22);
      border: 1px solid rgba(152, 198, 255, 0.3);
    }

    .chat-row.you .chat-bubble {
      background: rgba(112, 216, 194, 0.23);
      border-color: rgba(140, 247, 224, 0.35);
      color: #e8fff8;
    }

    .dialog-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .dialog-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .dialog-btn.primary { background: var(--accent); color: #031120; }
    .dialog-btn.secondary { background: rgba(130, 164, 224, 0.2); color: #f2f7ff; }

    .fishing-wrap {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      background: rgba(3, 9, 18, 0.72);
    }

    .fishing-wrap.show {
      pointer-events: auto;
      opacity: 1;
    }

    .fishing-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .fishing-ui {
      position: absolute;
      top: var(--safe-top);
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .fishing-pill {
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(8, 13, 20, 0.8);
      border: 1px solid rgba(137, 196, 255, 0.4);
    }

    .fishing-controls {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 88px);
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 10px;
    }

    @keyframes floatY {
      50% { transform: translate(-50%, calc(-50% - 3px)); }
    }

    @keyframes travelPulse {
      0% { filter: brightness(1); transform: scale(1.01); }
      50% { filter: brightness(1.13); transform: scale(1.025); }
      100% { filter: brightness(1); transform: scale(1.01); }
    }

    @media (max-width: 420px) {
      .level { font-size: 24px; }
      .currencies { font-size: 18px; }
      .avatar { width: 48px; height: 48px; font-size: 24px; }
      .top-hud { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="viewport" id="gameRoot">
      <section class="scene-bg" id="sceneBg"></section>
      <section class="scene-overlay"></section>
      <div class="transition-fade" id="transitionFade"></div>
      <div class="scene-character" id="sceneCharacter" aria-hidden="true"></div>
      <section class="hitboxes" id="hitboxes"></section>

      <section class="hud">
        <header class="top-hud">
          <div class="panel profile">
            <div class="avatar">🧢</div>
            <div style="min-width:0;flex:1;">
              <div class="level">Lv. 5</div>
              <div class="xp"><div class="xp-fill" id="xpFill"></div></div>
              <div class="xp-text" id="xpText">450 / 1000 XP</div>
            </div>
          </div>

          <div class="panel currencies">
            <span>🪙 12,500</span>
            <span>💎 250</span>
          </div>
        </header>

        <div class="actions">
          <button class="icon-btn" aria-label="Mail">✉️<span class="badge">3</span></button>
          <button class="icon-btn" aria-label="Notifications">🔔<span class="badge">1</span></button>
          <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
        </div>

        <div class="panel bottom-nav">
          <button class="nav-btn active" data-nav="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-btn" data-nav="world"><span class="nav-icon">🗺️</span>World</button>
          <button class="nav-btn" id="searchBtn" data-nav="search"><span class="nav-icon">⌕</span>Search</button>
          <button class="nav-btn" data-nav="bag"><span class="nav-icon">👜</span>Bag</button>
          <button class="nav-btn" data-nav="menu"><span class="nav-icon">☰</span>Menu</button>
        </div>

        <div id="toast" class="toast"></div>
      </section>

      <section class="menu-overlay" id="menuOverlay">
        <aside class="menu-panel">
          <div class="menu-head">
            <h3 style="margin:0;">Меню</h3>
            <button class="close-btn" id="closeMenu">✕</button>
          </div>
          <div class="menu-item">Профиль</div>
          <div class="menu-item">Покедекс</div>
          <div class="menu-item">Квесты</div>
          <div class="menu-item">Инвентарь</div>
          <div class="menu-item">Настройки</div>
        </aside>
      </section>

      <section class="dialogs">
        <div class="dialog-wrap" id="npcDialog">
          <article class="dialog">
            <div class="dialog-head">
              <div class="dialog-title">
                <div class="npc-avatar"></div>
                <div>
                  <h3 style="margin:0;">Профессор Oak</h3>
                  <div style="font-size:12px;color:#9db9d8;">Квестовый чат</div>
                </div>
              </div>
              <button class="dialog-btn secondary" id="dialogClose">Закрыть</button>
            </div>
            <div class="chat-feed" id="dialogFeed"></div>
            <div class="dialog-actions">
              <button class="dialog-btn primary" id="dialogTalk">Ответить</button>
              <button class="dialog-btn secondary" id="dialogQuest">Взять квест</button>
              <button class="dialog-btn secondary" id="dialogLater">Позже</button>
            </div>
          </article>
        </div>
      </section>

      <section class="fishing-wrap" id="fishingWrap">
        <canvas class="fishing-stage" id="fishingCanvas"></canvas>
        <div class="fishing-ui">
          <div class="fishing-pill" id="fishingScore">Очки: 0</div>
          <button class="dialog-btn secondary" id="fishingClose">Закрыть рыбалку</button>
        </div>
        <div class="fishing-controls">
          <button class="dialog-btn primary" id="fishingPull">Тянуть леску</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const DESIGN_WIDTH = 1920;
    const DESIGN_HEIGHT = 1080;

    const musicTracks = {
      main: 'http://castles-vk.ru/park_music/1.mp3',
      road: 'http://castles-vk.ru/park_music/2.mp3',
      'lab-city': 'http://castles-vk.ru/park_music/3.mp3',
      default: 'http://castles-vk.ru/park_music/4.mp3',
      fishing: 'http://castles-vk.ru/park_music/5.mp3'
    };

    const scenes = {
      main: {
        bg: 'http://castles-vk.ru/pokepark/img/location/1.png',
        hotspots: [
          { id: 'lab', x: 760, y: 330, width: 420, height: 360, marker: '🧪', markerClass: 'lab', markerX: 980, markerY: 350, action: { type: 'scene', to: 'lab-entry', toast: 'Переход в лабораторию...' } },
          { id: 'house-a', x: 280, y: 300, width: 320, height: 320, marker: '⌂', markerClass: 'home', markerX: 430, markerY: 300, action: { type: 'scene', to: 'house-6', toast: 'Входим в дом №1' } },
          { id: 'house-b', x: 1160, y: 350, width: 300, height: 300, marker: '⌂', markerClass: 'home', markerX: 1300, markerY: 330, action: { type: 'scene', to: 'house-4', toast: 'Входим в дом №2' } },
          { id: 'house-c', x: 1190, y: 680, width: 340, height: 300, marker: '⌂', markerClass: 'home', markerX: 1360, markerY: 670, action: { type: 'scene', to: 'house-5', toast: 'Входим в дом №3' } },
          { id: 'to-road', x: 820, y: 90, width: 280, height: 210, marker: '🛤️', markerClass: 'exit', markerX: 960, markerY: 120, action: { type: 'scene', to: 'road', toast: 'Выход на тропу' } },
          { id: 'dock-fishing', x: 1550, y: 610, width: 330, height: 280, marker: '🎣', markerClass: 'npc', markerX: 1700, markerY: 620, action: { type: 'fishing', toast: 'Причал: мини-игра "Рыбалка"' } }
        ]
      },
      road: {
        bg: 'http://castles-vk.ru/pokepark/img/location/7.png',
        hotspots: [
          { id: 'road-back', x: 40, y: 380, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 170, markerY: 350, action: { type: 'scene', to: 'main', toast: 'Возврат в главную локацию' } }
        ]
      },
      'house-6': {
        bg: 'https://castles-vk.ru/pokepark/img/location/6.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'house-4': {
        bg: 'https://castles-vk.ru/pokepark/img/location/4.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'house-5': {
        bg: 'https://castles-vk.ru/pokepark/img/location/5.png',
        hotspots: [
          { id: 'door-out', x: 850, y: 560, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 960, markerY: 520, action: { type: 'scene', to: 'main', toast: 'Вы вышли из дома' } }
        ]
      },
      'lab-entry': {
        bg: 'http://castles-vk.ru/pokepark/img/location/2.png',
        hotspots: [
          { id: 'to-city-lab', x: 820, y: 360, width: 300, height: 350, marker: '🧬', markerClass: 'lab', markerX: 970, markerY: 330, action: { type: 'scene', to: 'lab-city', toast: 'Переход в городскую лабораторию...' } },
          { id: 'exit-to-main', x: 40, y: 380, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 170, markerY: 350, action: { type: 'scene', to: 'main', toast: 'Возврат на главную локацию' } }
        ]
      },
      'lab-city': {
        bg: 'http://castles-vk.ru/pokepark/img/location/3.png',
        hotspots: [
          { id: 'npc-professor', x: 875, y: 390, width: 220, height: 430, marker: '💬', markerClass: 'npc', markerX: 995, markerY: 370, action: { type: 'dialog', toast: 'Профессор готов к разговору' } },
          { id: 'exit-lab-city', x: 32, y: 390, width: 220, height: 300, marker: '⇦', markerClass: 'exit', markerX: 165, markerY: 360, action: { type: 'scene', to: 'main', toast: 'Вы покинули лабораторию' } }
        ]
      }
    };

    const sceneBg = document.getElementById('sceneBg');
    const hitboxes = document.getElementById('hitboxes');
    const transitionFade = document.getElementById('transitionFade');
    const sceneCharacter = document.getElementById('sceneCharacter');
    const toast = document.getElementById('toast');
    const xpFill = document.getElementById('xpFill');
    const xpText = document.getElementById('xpText');
    const gameRoot = document.getElementById('gameRoot');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuBtn = document.getElementById('menuBtn');
    const closeMenu = document.getElementById('closeMenu');
    const searchBtn = document.getElementById('searchBtn');
    const npcDialog = document.getElementById('npcDialog');
    const dialogClose = document.getElementById('dialogClose');
    const dialogTalk = document.getElementById('dialogTalk');
    const dialogQuest = document.getElementById('dialogQuest');
    const dialogLater = document.getElementById('dialogLater');
    const dialogFeed = document.getElementById('dialogFeed');
    const fishingWrap = document.getElementById('fishingWrap');
    const fishingCanvas = document.getElementById('fishingCanvas');
    const fishingClose = document.getElementById('fishingClose');
    const fishingPull = document.getElementById('fishingPull');
    const fishingScore = document.getElementById('fishingScore');

    const state = {
      scene: 'main',
      xpCurrent: 450,
      xpTotal: 1000,
      toastTimer: null,
      userActivated: false,
      dialogMessages: [],
      fishScore: 0,
      fishingActive: false
    };

    const audioState = {
      channels: [new Audio(), new Audio()],
      activeChannel: 0
    };
    audioState.channels.forEach((audio) => {
      audio.loop = true;
      audio.volume = 0;
    });

    const fishingState = {
      width: 0,
      height: 0,
      lineX: 0,
      lineY: 110,
      fishX: 0,
      fishY: 0,
      fishVX: 2.8,
      fishVY: 1.2,
      hooked: false,
      tension: 0
    };

    const showToast = (text) => {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    };

    const setActiveNav = (target) => {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.nav === target);
      });
    };

    const animateXpTo = (target) => {
      const value = Math.max(0, Math.min(state.xpTotal, target));
      state.xpCurrent = value;
      xpFill.style.width = `${(value / state.xpTotal) * 100}%`;
      xpText.textContent = `${value} / ${state.xpTotal} XP`;
    };

    const resolveTrackByScene = (sceneId) => {
      if (sceneId === 'main') return musicTracks.main;
      if (sceneId === 'road') return musicTracks.road;
      if (sceneId === 'lab-city') return musicTracks['lab-city'];
      return musicTracks.default;
    };

    const crossFadeTo = async (src, duration = 900) => {
      if (!state.userActivated) return;
      const nextIndex = 1 - audioState.activeChannel;
      const current = audioState.channels[audioState.activeChannel];
      const next = audioState.channels[nextIndex];
      if (!src) return;
      if (current.src.includes(src) && !current.paused) return;
      next.src = src;
      next.currentTime = 0;
      next.volume = 0;
      try { await next.play(); } catch (error) { return; }
      const steps = 18;
      const interval = duration / steps;
      let tick = 0;
      clearInterval(audioState.fadeTimer);
      audioState.fadeTimer = setInterval(() => {
        tick += 1;
        const ratio = Math.min(1, tick / steps);
        next.volume = 0.45 * ratio;
        current.volume = 0.45 * (1 - ratio);
        if (ratio >= 1) {
          clearInterval(audioState.fadeTimer);
          current.pause();
          current.currentTime = 0;
          audioState.activeChannel = nextIndex;
        }
      }, interval);
    };

    const ensureAudioReady = () => {
      if (state.userActivated) return;
      state.userActivated = true;
      crossFadeTo(resolveTrackByScene(state.scene), 500);
    };

    const updateSceneCharacter = (sceneId) => {
      const show = sceneId === 'lab-city';
      sceneCharacter.classList.toggle('show', show);
    };

    const setScene = (sceneId) => {
      if (!scenes[sceneId]) return;
      state.scene = sceneId;
      sceneBg.style.backgroundImage = `url('${scenes[sceneId].bg}')`;
      sceneBg.classList.remove('travel');
      void sceneBg.offsetWidth;
      sceneBg.classList.add('travel');
      npcDialog.classList.remove('show');
      updateSceneCharacter(sceneId);
      renderHotspots();
      crossFadeTo(resolveTrackByScene(sceneId));
    };

    const addDialogMessage = (author, text, you = false) => {
      state.dialogMessages.push({ author, text, you });
      const row = document.createElement('div');
      row.className = `chat-row ${you ? 'you' : ''}`;
      row.innerHTML = you
        ? `<div class="chat-bubble">${text}</div><div class="chat-icon you">🧢</div>`
        : `<div class="chat-icon">🧪</div><div class="chat-bubble"><strong>${author}:</strong> ${text}</div>`;
      dialogFeed.appendChild(row);
      dialogFeed.scrollTop = dialogFeed.scrollHeight;
    };

    const openProfessorDialog = () => {
      dialogFeed.innerHTML = '';
      state.dialogMessages = [];
      addDialogMessage('Профессор Oak', 'Привет! Это формат квестового чата: мягко, как мессенджер.');
      addDialogMessage('Профессор Oak', 'На причале в главной локации есть рыбалка. Попробуешь?');
      npcDialog.classList.add('show');
    };

    const openFishing = () => {
      state.fishingActive = true;
      fishingWrap.classList.add('show');
      state.fishScore = 0;
      fishingScore.textContent = 'Очки: 0';
      resizeFishingCanvas();
      resetFish();
      crossFadeTo(musicTracks.fishing, 800);
      showToast('Рыбалка началась');
      requestAnimationFrame(fishingLoop);
    };

    const closeFishingGame = () => {
      state.fishingActive = false;
      fishingWrap.classList.remove('show');
      crossFadeTo(resolveTrackByScene(state.scene), 800);
    };

    const resetFish = () => {
      fishingState.fishX = fishingState.width * 0.66;
      fishingState.fishY = fishingState.height * 0.6;
      fishingState.fishVX = 2 + Math.random() * 2;
      fishingState.fishVY = (Math.random() - 0.5) * 2;
      fishingState.hooked = false;
      fishingState.tension = 0;
    };

    const resizeFishingCanvas = () => {
      fishingState.width = fishingCanvas.width = window.innerWidth;
      fishingState.height = fishingCanvas.height = window.innerHeight;
      fishingState.lineX = fishingState.width * 0.5;
      fishingState.lineY = Math.min(fishingState.height - 160, Math.max(130, fishingState.height * 0.45));
    };

    const fishingLoop = () => {
      if (!state.fishingActive) return;
      const ctx = fishingCanvas.getContext('2d');
      ctx.clearRect(0, 0, fishingState.width, fishingState.height);
      ctx.fillStyle = '#0e2138';
      ctx.fillRect(0, 0, fishingState.width, fishingState.height);
      const gradient = ctx.createLinearGradient(0, fishingState.height * 0.2, 0, fishingState.height);
      gradient.addColorStop(0, '#2e7bc4');
      gradient.addColorStop(1, '#0b2748');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, fishingState.height * 0.2, fishingState.width, fishingState.height * 0.8);

      if (!fishingState.hooked) {
        fishingState.fishX += fishingState.fishVX;
        fishingState.fishY += fishingState.fishVY;
      } else {
        fishingState.fishX += (fishingState.lineX - fishingState.fishX) * 0.08;
        fishingState.fishY += (fishingState.lineY - fishingState.fishY) * 0.08;
        fishingState.tension += 0.5;
      }
      if (fishingState.fishX > fishingState.width - 30 || fishingState.fishX < 30) fishingState.fishVX *= -1;
      if (fishingState.fishY > fishingState.height - 80 || fishingState.fishY < fishingState.height * 0.25) fishingState.fishVY *= -1;

      ctx.strokeStyle = '#dbefff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(fishingState.lineX, 0);
      ctx.lineTo(fishingState.lineX, fishingState.lineY);
      ctx.stroke();

      ctx.fillStyle = '#ffdc76';
      ctx.beginPath();
      ctx.arc(fishingState.lineX, fishingState.lineY, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff8a7a';
      ctx.beginPath();
      ctx.ellipse(fishingState.fishX, fishingState.fishY, 24, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(fishingState.fishX + 8, fishingState.fishY - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      const dx = fishingState.fishX - fishingState.lineX;
      const dy = fishingState.fishY - fishingState.lineY;
      const dist = Math.hypot(dx, dy);
      if (!fishingState.hooked && dist < 28) {
        fishingState.hooked = true;
        showToast('Рыба на крючке! Тяни леску');
      }
      if (fishingState.hooked && fishingState.lineY < 95) {
        state.fishScore += 10;
        fishingScore.textContent = `Очки: ${state.fishScore}`;
        animateXpTo(state.xpCurrent + 15);
        showToast('Улов +10');
        fishingState.lineY = 150;
        resetFish();
      }
      requestAnimationFrame(fishingLoop);
    };

    const actionByHotspot = (spot) => {
      if (!spot.action) return;
      if (spot.action.toast) showToast(spot.action.toast);

      if (spot.action.type === 'scene') {
        animateXpTo(state.xpCurrent + 8);
        transitionFade.classList.add('active');
        setTimeout(() => setScene(spot.action.to), 140);
        setTimeout(() => transitionFade.classList.remove('active'), 320);
      }

      if (spot.action.type === 'dialog') openProfessorDialog();
      if (spot.action.type === 'fishing') openFishing();
    };

    const renderHotspots = () => {
      const current = scenes[state.scene];
      if (!current) return;
      const rect = gameRoot.getBoundingClientRect();
      const sx = rect.width / DESIGN_WIDTH;
      const sy = rect.height / DESIGN_HEIGHT;
      hitboxes.innerHTML = '';

      current.hotspots.forEach((spot) => {
        const button = document.createElement('button');
        button.className = 'hotspot';
        button.style.left = `${spot.x * sx}px`;
        button.style.top = `${spot.y * sy}px`;
        button.style.width = `${spot.width * sx}px`;
        button.style.height = `${spot.height * sy}px`;
        button.ariaLabel = spot.id;
        button.addEventListener('click', () => actionByHotspot(spot));

        const marker = document.createElement('div');
        marker.className = `marker ${spot.markerClass}`;
        marker.style.left = `${spot.markerX * sx}px`;
        marker.style.top = `${spot.markerY * sy}px`;
        marker.textContent = spot.marker;

        hitboxes.append(button, marker);
      });
    };

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        ensureAudioReady();
        const nav = btn.dataset.nav;
        setActiveNav(nav);
        if (nav === 'menu') menuOverlay.classList.add('open');
        else menuOverlay.classList.remove('open');
      });
    });

    window.addEventListener('pointerdown', ensureAudioReady, { once: true });
    searchBtn.addEventListener('click', () => {
      showToast('Сканирование мира...');
      animateXpTo(state.xpCurrent + 12);
    });
    menuBtn.addEventListener('click', () => {
      menuOverlay.classList.add('open');
      setActiveNav('menu');
    });
    closeMenu.addEventListener('click', () => {
      menuOverlay.classList.remove('open');
      setActiveNav('home');
    });
    menuOverlay.addEventListener('click', (event) => {
      if (event.target === menuOverlay) {
        menuOverlay.classList.remove('open');
        setActiveNav('home');
      }
    });
    dialogClose.addEventListener('click', () => npcDialog.classList.remove('show'));
    dialogTalk.addEventListener('click', () => {
      addDialogMessage('Вы', 'Готов начать!', true);
      setTimeout(() => addDialogMessage('Профессор Oak', 'Отлично! Изучи локации и набирай очки.'), 250);
    });
    dialogQuest.addEventListener('click', () => {
      addDialogMessage('Вы', 'Беру квест на изучение мира.', true);
      setTimeout(() => addDialogMessage('Профессор Oak', 'Квест принят: пройди тропу и поймай хотя бы одну рыбу.'), 280);
    });
    dialogLater.addEventListener('click', () => {
      addDialogMessage('Вы', 'Вернусь чуть позже.', true);
      setTimeout(() => addDialogMessage('Профессор Oak', 'Хорошо, я буду в лаборатории.'), 250);
    });

    fishingClose.addEventListener('click', closeFishingGame);
    fishingPull.addEventListener('pointerdown', () => {
      if (!state.fishingActive) return;
      fishingState.lineY = Math.max(64, fishingState.lineY - (fishingState.hooked ? 40 : 20));
    });
    fishingCanvas.addEventListener('pointermove', (event) => {
      if (!state.fishingActive) return;
      fishingState.lineX = event.clientX;
      fishingState.lineY = Math.min(fishingState.height - 80, Math.max(90, event.clientY));
    });

    window.addEventListener('resize', () => {
      window.requestAnimationFrame(() => {
        renderHotspots();
        if (state.fishingActive) resizeFishingCanvas();
      });
    }, { passive: true });

    setScene('main');
    updateSceneCharacter('main');
    animateXpTo(state.xpCurrent);
  </script>
</body>
</html>
