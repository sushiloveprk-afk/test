<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Инвентарь — mobile game UI</title>
  <style>
    :root {
      --panel-1: #f8fbff;
      --panel-2: #eef4fb;
      --panel-3: #e6eef8;
      --panel-4: #d9e5f3;
      --line: #c8d6e8;
      --line-strong: #b8cae0;
      --text-main: #31476d;
      --text-main-2: #425980;
      --text-muted: #6c84a8;
      --text-muted-2: #7b8faa;
      --blue-1: #59b7ff;
      --blue-2: #3a96f0;
      --blue-3: #2a77e6;
      --green-1: #7ce84c;
      --green-2: #44d335;
      --green-3: #2dbe2f;
      --orange-1: #ffc84a;
      --orange-2: #f6a623;
      --orange-3: #e08a12;
      --red-1: #ff8e87;
      --red-2: #f26a5f;
      --red-3: #e05248;
      --gold-1: #ffd76b;
      --gold-2: #f4c44d;
      --soft-shadow: 0 2px 6px rgba(80, 120, 170, 0.1), 0 6px 18px rgba(80, 120, 170, 0.1);
      --rounded-window: 34px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "Nunito Sans", "Rubik", system-ui, sans-serif;
      color: var(--text-main);
    }

    .scene {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      background: url('https://castles-vk.ru/pokepark/img/location/1.png') center/cover no-repeat;
    }

    .inventory {
      width: min(100vw - 16px, 980px);
      height: min(100vh - 16px, 1660px);
      border-radius: var(--rounded-window);
      border: 2px solid var(--line-strong);
      background: linear-gradient(180deg, #fdfeff 0%, #eaf2fb 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), var(--soft-shadow);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto auto auto;
      gap: 10px;
      padding: 14px;
      backdrop-filter: blur(2px);
      min-height: 0;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 1px solid #c9d7e8;
      padding: 2px 0 10px;
      min-width: 0;
    }

    .title {
      text-align: center;
      margin-left: 52px;
      font-weight: 900;
      font-size: clamp(24px, 4.1vh, 44px);
      line-height: 1;
      letter-spacing: .3px;
      color: #2f436a;
    }

    .icon-btn {
      border: 1px solid #c9d7e8;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #e5edf8 100%);
      color: #3f5a86;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 3px 8px rgba(80,120,170,.12);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 900;
      padding: 0;
    }

    .close { width: 52px; height: 52px; font-size: 34px; line-height: 1; }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      height: 58px;
      border-radius: 999px;
      border: 1px solid #c8d6e8;
      background: linear-gradient(180deg, #ffffff, #edf3fb);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      box-shadow: inset 0 2px 4px rgba(168, 190, 219, .12);
    }

    .search input {
      border: 0;
      outline: none;
      width: 100%;
      background: transparent;
      color: var(--text-main-2);
      font-size: clamp(14px, 1.6vw, 18px);
      font-weight: 700;
      min-width: 0;
    }

    .search input::placeholder { color: #8ba0bf; }

    .magnifier {
      width: 22px;
      height: 22px;
      border: 3px solid #8ea5c7;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }

    .magnifier::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 3px;
      border-radius: 3px;
      background: #8ea5c7;
      right: -8px;
      bottom: -5px;
      transform: rotate(40deg);
    }

    .capacity {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5574a2;
      font-size: clamp(13px, 1.45vw, 16px);
      font-weight: 700;
      white-space: nowrap;
    }

    .capacity strong {
      color: #334b73;
      font-size: 1.25em;
      font-weight: 900;
    }

    .plus-btn { width: 44px; height: 44px; font-size: 32px; }

    .tabs {
      border: 1px solid #c8d6e8;
      border-radius: 20px;
      background: linear-gradient(180deg, #f9fcff, #e8f0fa);
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 3px;
      min-height: 0;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      border: 0;
      border-right: 1px solid #d3e0f1;
      min-width: 112px;
      height: 78px;
      background: transparent;
      color: #4f678f;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 8px;
      flex-shrink: 0;
    }

    .tab:last-child { border-right: 0; }
    .tab .ico { font-size: 24px; line-height: 1; }

    .tab.active {
      border-right-color: transparent;
      border-radius: 18px;
      color: white;
      background: linear-gradient(180deg, #66c1ff 0%, #4fa9f8 45%, #2e84ea 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 12px rgba(53, 120, 210, .24);
    }

    .grid-wrap {
      border-radius: 22px;
      border: 1px solid #c8d6e8;
      background: linear-gradient(180deg, #f7fbff 0%, #edf4fc 100%);
      padding: 8px;
      min-height: 0;
    }

    .grid {
      height: 100%;
      overflow-y: auto;
      padding-right: 6px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      align-content: start;
      scrollbar-color: #bfd0e7 #eef4fb;
    }

    .grid::-webkit-scrollbar { width: 8px; }
    .grid::-webkit-scrollbar-track { background: #eef4fb; border-radius: 999px; }
    .grid::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #e8f1fd, #cfe0f4); border-radius: 999px; }

    .item {
      border: 1px solid #c9d7e8;
      border-radius: 18px;
      min-height: 126px;
      background: linear-gradient(180deg, #fafcff, #f1f6fd);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
      padding: 7px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 6px;
      cursor: pointer;
      position: relative;
    }

    .item-media {
      width: 100%;
      min-height: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(236, 244, 254, .96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
      overflow: hidden;
      padding: 4px;
      display: grid;
      place-items: center;
    }

    .item.active {
      border-color: var(--gold-2);
      background: linear-gradient(180deg, #fffef7, #f4f8ff);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 2px rgba(255,215,107,.25);
    }

    .item.active::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 8px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffb95c, #ff8a2a);
      box-shadow: 0 0 0 2px #fff;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin: 0;
      filter: drop-shadow(0 4px 5px rgba(60, 100, 150, .22));
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #47628e;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .1px;
    }

    .qty-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(80,120,170,.18);
    }

    .details {
      border: 1px solid #c9d7e8;
      border-radius: 22px;
      background: linear-gradient(180deg, #f7fbff, #eaf2fb);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px;
    }

    .selected-slot {
      width: 106px;
      height: 106px;
      border-radius: 20px;
      border: 2px solid #6bb0f4;
      background: linear-gradient(180deg, #ffffff, #edf4ff);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
    }

    .selected-slot img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }

    h3 {
      margin: 0;
      font-size: clamp(20px, 1.8vw, 26px);
      font-weight: 900;
      line-height: 1;
      color: #2f456b;
    }

    .badge {
      display: inline-block;
      margin-left: 10px;
      border-radius: 999px;
      border: 1px solid #c3d7f2;
      background: #e8f2ff;
      color: #4f7db7;
      font-size: 14px;
      font-weight: 800;
      padding: 4px 12px;
      vertical-align: 10%;
    }

    .description {
      margin-top: 10px;
      font-size: clamp(13px, 1.4vw, 16px);
      color: #657fa7;
      font-weight: 700;
    }

    .stepper-wrap {
      border-left: 1px solid #d8e2f0;
      padding-left: 14px;
      min-width: 240px;
    }

    .stepper-label {
      color: #5f7aa6;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stepper {
      height: 58px;
      border: 1px solid #c9d7e8;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #ebf2fb);
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
    }

    .stepper button {
      border: 0;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(180deg, #f6fbff, #dce8f9);
      color: #48658f;
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      cursor: pointer;
    }

    .stepper strong {
      text-align: center;
      font-size: 24px;
      color: #314a73;
      font-weight: 900;
    }

    .actions, .bottom-actions {
      display: grid;
      gap: 10px;
    }

    .actions { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .bottom-actions { grid-template-columns: 1fr 1fr 1fr auto; }

    .btn {
      border: 1px solid transparent;
      border-radius: 16px;
      color: #fff;
      font-size: clamp(15px, 1.35vw, 19px);
      height: 62px;
      font-weight: 900;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0,0,0,.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px rgba(80,120,170,.15);
    }

    .btn.green { background: linear-gradient(180deg, #91f25b, #36c932); border-color: #4fbf42; }
    .btn.blue { background: linear-gradient(180deg, #66c1ff, #2e84ea); border-color: #4a98ea; }
    .btn.orange { background: linear-gradient(180deg, #ffd45e, #f2a323); border-color: #e3a52e; }
    .btn.red { background: linear-gradient(180deg, #ff9e98, #e95b51); border-color: #dc6c66; }

    .service {
      border: 1px solid #c2d2e8;
      border-radius: 16px;
      background: linear-gradient(180deg, #fbfdff, #e4ecf8);
      color: #4f6b96;
      font-size: clamp(14px, 1.2vw, 17px);
      font-weight: 900;
      height: 56px;
      cursor: pointer;
    }

    .service.sell {
      background: linear-gradient(180deg, #5fb7ff, #3693ea);
      color: #fff;
      border-color: #4b9cec;
    }

    .service.settings { width: 64px; font-size: 30px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(10px);
      background: rgba(42, 72, 116, .92);
      color: #fff;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 800;
      opacity: 0;
      transition: .2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 1200px), (max-height: 1400px) {
      .inventory { width: min(100vw - 14px, 640px); height: min(100vh - 14px, 1120px); padding: 10px; gap: 8px; }
      .title { font-size: clamp(24px, 6.4vw, 40px); margin-left: 36px; }
      .close { width: 44px; height: 44px; font-size: 30px; }
      .search { height: 48px; }
      .search input { font-size: clamp(15px, 3.1vw, 20px); }
      .capacity { font-size: clamp(13px, 2.3vw, 17px); }
      .plus-btn { width: 40px; height: 40px; font-size: 32px; }
      .tab { min-width: 92px; height: 66px; font-size: 14px; }
      .tab .ico { font-size: 19px; }
      .grid { gap: 6px; }
      .item { min-height: 92px; border-radius: 16px; }
      .item-media { border-radius: 12px; padding: 3px; }
      .qty { font-size: 12px; }
      .qty-dot { width: 10px; height: 10px; }
      .selected-slot { width: 76px; height: 76px; border-radius: 16px; }
      .selected-slot img { padding: 8px; }
      h3 { font-size: clamp(20px, 4.4vw, 28px); }
      .badge { font-size: 14px; padding: 3px 9px; }
      .description { margin-top: 6px; font-size: clamp(14px, 2.8vw, 17px); }
      .stepper-wrap { min-width: 170px; }
      .stepper-label { font-size: 16px; }
      .stepper { height: 46px; grid-template-columns: 42px minmax(0, 1fr) 42px; border-radius: 14px; }
      .stepper button { height: 34px; border-radius: 10px; font-size: 26px; }
      .stepper strong { font-size: 26px; }
      .btn { height: 52px; border-radius: 14px; font-size: clamp(15px, 2.8vw, 19px); }
      .service { height: 46px; border-radius: 14px; font-size: clamp(13px, 2.2vw, 16px); }
      .service.settings { width: 46px; font-size: 20px; }
    }

    @media (max-width: 520px) {
      .search-row { grid-template-columns: 1fr; }
      .details { grid-template-columns: auto 1fr; }
      .stepper-wrap { grid-column: 1 / -1; border-left: 0; border-top: 1px solid #d8e2f0; padding-left: 0; padding-top: 8px; min-width: 0; }
      .actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .bottom-actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .service.settings { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <section class="inventory">
      <div class="top">
        <div class="title">Инвентарь</div>
        <button class="icon-btn close" id="closeBtn">×</button>
      </div>

      <div class="search-row">
        <label class="search">
          <span class="magnifier" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="Поиск по предметам" />
        </label>
        <div class="capacity">Предметов: <strong id="capText">0 / 120</strong> <button class="icon-btn plus-btn" id="expandBtn">+</button></div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>

      <div class="details">
        <div class="selected-slot"><img id="selectedImg" alt="Выбранный предмет" /></div>
        <div>
          <h3 id="selectedName"></h3>
          <div class="description" id="selectedDescription"></div>
        </div>
        <div class="stepper-wrap">
          <div class="stepper-label">Количество:</div>
          <div class="stepper">
            <button id="minusBtn">−</button>
            <strong id="amountText">1</strong>
            <button id="plusBtn">+</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn green" id="useBtn">✅ Использовать</button>
        <button class="btn blue" id="splitBtn">↕ Разделить</button>
        <button class="btn orange" id="craftBtn">⚒ В крафт</button>
        <button class="btn red" id="dropBtn">🗑 Выбросить</button>
      </div>

      <div class="bottom-actions">
        <button class="service sell" id="sellBtn">💰 Продать</button>
        <button class="service" id="sortBtn">↕ Сортировка</button>
        <button class="service" id="filterBtn">⚲ Фильтр</button>
        <button class="service settings" id="settingsBtn">⚙</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const categories = [
      { key: 'all', label: 'Все', icon: '▦' },
      { key: 'resources', label: 'Ресурсы', icon: '🌿' },
      { key: 'consumables', label: 'Расходники', icon: '🧪' },
      { key: 'materials', label: 'Материалы', icon: '💎' },
      { key: 'food', label: 'Еда', icon: '🍎' },
      { key: 'craft', label: 'Крафт', icon: '⚒' },
      { key: 'keys', label: 'Ключи', icon: '🗝' }
    ];

    const rarityColors = ['#6fb0ff','#ff9b62','#ffd565','#8fd783','#d6a3ff','#78d8cc','#f294bf'];

    const items = [
      ['Покебол','consumables',8,'Ключевой предмет','Позволяет ловить монстров.'],
      ['Эликсир сияния','consumables',5,'Редкость','Усиливает шанс критического броска.'],
      ['Бутыль маны','consumables',3,'Расходник','Восстанавливает энергию навыков.'],
      ['Мастерсфера','keys',1,'Ключевой предмет','Ловит редких монстров без промаха.'],
      ['Небесное перо','resources',25,'Ресурс','Лёгкий материал для улучшений.'],
      ['Карта руин','keys',4,'Ключ','Открывает скрытые руины.'],
      ['Свиток ремесла','craft',4,'Крафт','Ускоряет изготовление вещей.'],
      ['Элементальные сферы','resources',15,'Ресурс','Набор стихийных зарядов.'],
      ['Ягоды леса','food',16,'Еда','Питательная закуска для питомцев.'],
      ['Кристальный монокль','materials',12,'Материал','Оптический кристалл высокой чистоты.'],
      ['Золотой ключ','keys',1,'Ключ','Открывает древние сундуки.'],
      ['Звёздный осколок','resources',3,'Ресурс','Блестящий редкий осколок.'],
      ['Сердце дружбы','food',7,'Еда','Поднимает настроение компаньона.'],
      ['Призма эха','materials',9,'Материал','Резонирующий кристалл для крафта.'],
      ['Старинный свиток','craft',2,'Крафт','Рецепт продвинутых предметов.'],
      ['Доски сосны','materials',18,'Материал','Заготовка для постройки станков.'],
      ['Глыба руды','materials',11,'Материал','Металл для ковки инструментов.'],
      ['Ледяной кристалл','materials',6,'Материал','Холодный минерал для чар.'],
      ['Лист целителя','food',30,'Еда','Снимает слабые дебаффы.'],
      ['Янтарный мёд','food',5,'Еда','Редкий сладкий бафф к скорости.']
    ].map((entry, index) => ({
      id: `item-${index + 1}`,
      name: entry[0],
      cat: entry[1],
      count: entry[2],
      tag: entry[3],
      desc: entry[4],
      marker: rarityColors[index % rarityColors.length],
      img: `https://castles-vk.ru/pokepark/item/${index + 1}.png`
    }));

    const state = {
      category: 'all',
      search: '',
      selectedId: items[0].id,
      amount: items[0].count,
      maxCapacity: 120
    };

    const el = {
      tabs: document.getElementById('tabs'),
      grid: document.getElementById('grid'),
      searchInput: document.getElementById('searchInput'),
      selectedImg: document.getElementById('selectedImg'),
      selectedName: document.getElementById('selectedName'),
      selectedDescription: document.getElementById('selectedDescription'),
      amountText: document.getElementById('amountText'),
      capText: document.getElementById('capText'),
      toast: document.getElementById('toast')
    };

    const selectedItem = () => items.find((item) => item.id === state.selectedId) || items[0];

    const filteredItems = () => items.filter((item) => {
      const byCategory = state.category === 'all' || item.cat === state.category;
      const query = `${item.name} ${item.tag} ${item.desc}`.toLowerCase();
      const bySearch = query.includes(state.search.toLowerCase());
      return byCategory && bySearch;
    });

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 1500);
    }

    function renderTabs() {
      el.tabs.innerHTML = '';
      categories.forEach((category) => {
        const btn = document.createElement('button');
        btn.className = `tab ${state.category === category.key ? 'active' : ''}`;
        btn.innerHTML = `<span class="ico">${category.icon}</span><span>${category.label}</span>`;
        btn.onclick = () => {
          state.category = category.key;
          render();
        };
        el.tabs.append(btn);
      });
    }

    function renderGrid() {
      const view = filteredItems();
      el.grid.innerHTML = '';

      if (!view.length) {
        el.grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#6d84a7; font-size:18px; font-weight:800; padding:24px 8px;">Ничего не найдено. Попробуйте изменить поиск.</div>';
        return;
      }

      if (!view.find((item) => item.id === state.selectedId)) {
        state.selectedId = view[0].id;
        state.amount = Math.min(state.amount, view[0].count) || view[0].count;
      }

      view.forEach((item) => {
        const card = document.createElement('button');
        card.className = `item ${item.id === state.selectedId ? 'active' : ''}`;
        card.innerHTML = `
          <div class="item-media"><img src="${item.img}" alt="${item.name}" /></div>
          <div class="qty"><span class="qty-dot" style="background:${item.marker}"></span><span>x${item.count}</span></div>
        `;
        card.onclick = () => {
          state.selectedId = item.id;
          state.amount = item.count;
          render();
        };
        el.grid.append(card);
      });
    }

    function renderDetails() {
      const item = selectedItem();
      el.selectedImg.src = item.img;
      el.selectedName.innerHTML = `${item.name}<span class="badge">${item.tag}</span>`;
      el.selectedDescription.textContent = item.desc;
      el.amountText.textContent = state.amount;
      const total = items.reduce((sum, itemData) => sum + itemData.count, 0);
      el.capText.textContent = `${total} / ${state.maxCapacity}`;
    }

    function adjustAmount(delta) {
      const item = selectedItem();
      state.amount = Math.max(1, Math.min(item.count || 1, state.amount + delta));
      renderDetails();
    }

    function doAction(actionKey) {
      const item = selectedItem();
      if (!item) return;

      if (['use', 'drop', 'sell'].includes(actionKey) && item.count < state.amount) {
        showToast('Недостаточно предметов.');
        return;
      }

      if (actionKey === 'use') {
        item.count = Math.max(0, item.count - state.amount);
        showToast(`Использовано: ${item.name} x${state.amount}`);
      }
      if (actionKey === 'drop') {
        item.count = Math.max(0, item.count - state.amount);
        showToast(`Выброшено: ${item.name} x${state.amount}`);
      }
      if (actionKey === 'sell') {
        item.count = Math.max(0, item.count - state.amount);
        showToast(`Продано: ${item.name} x${state.amount}`);
      }
      if (actionKey === 'split') {
        showToast(`Разделено: ${item.name} x${state.amount}`);
      }
      if (actionKey === 'craft') {
        showToast(`Отправлено в крафт: ${item.name}.`);
      }

      state.amount = Math.max(1, item.count || 1);
      render();
    }

    function render() {
      renderTabs();
      renderGrid();
      renderDetails();
    }

    document.getElementById('plusBtn').onclick = () => adjustAmount(1);
    document.getElementById('minusBtn').onclick = () => adjustAmount(-1);

    el.searchInput.addEventListener('input', (event) => {
      state.search = event.target.value.trim();
      render();
    });

    document.getElementById('expandBtn').onclick = () => {
      state.maxCapacity += 20;
      showToast('Куплено +20 слотов инвентаря.');
      renderDetails();
    };

    document.getElementById('useBtn').onclick = () => doAction('use');
    document.getElementById('splitBtn').onclick = () => doAction('split');
    document.getElementById('craftBtn').onclick = () => doAction('craft');
    document.getElementById('dropBtn').onclick = () => doAction('drop');
    document.getElementById('sellBtn').onclick = () => doAction('sell');

    document.getElementById('sortBtn').onclick = () => {
      items.sort((a, b) => b.count - a.count);
      showToast('Сортировка: сначала большие стаки.');
      render();
    };

    document.getElementById('filterBtn').onclick = () => {
      state.search = 'кристалл';
      el.searchInput.value = state.search;
      showToast('Фильтр: кристаллы.');
      render();
    };

    document.getElementById('settingsBtn').onclick = () => showToast('Настройки (демо-режим).');
    document.getElementById('closeBtn').onclick = () => showToast('Окно нельзя закрыть в демо.');

    render();
  </script>
</body>
</html>
