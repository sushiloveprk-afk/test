<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PokePark Inventory Concept</title>
  <style>
    :root {
      --panel: #deebff;
      --panel-soft: #f3f8ff;
      --line: #bfd2f1;
      --line-strong: #a8c0e6;
      --text: #2d466e;
      --muted: #6480ad;
      --shadow: 0 18px 42px rgba(7, 25, 55, 0.34);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
      background: radial-gradient(120% 100% at 50% 0%, #8ad2ff 0%, #61aff1 45%, #4b8fdb 100%);
    }

    .scene {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.2) 0%, rgba(9,32,74,.26) 100%),
        radial-gradient(120% 80% at 10% 0%, rgba(255,255,255,.35), transparent 60%),
        url('https://castles-vk.ru/pokepark/img/location/1.png') center/cover no-repeat;
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .phone {
      width: min(100vw, 520px);
      height: min(100vh, calc(min(100vw, 520px) * 1.78));
      aspect-ratio: 9/16;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      background: transparent;
    }

    .inventory {
      position: absolute;
      inset: 10px;
      border-radius: 26px;
      background: linear-gradient(180deg, #eef5ff 0%, #dce9fb 100%);
      border: 2px solid var(--line-strong);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.94), 0 10px 24px rgba(12, 43, 88, .22);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto auto;
      gap: 8px;
      padding: 10px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 2px solid #c9d9f2;
      padding-bottom: 8px;
      min-width: 0;
    }

    .title {
      text-align: center;
      margin-left: 40px;
      font-weight: 900;
      font-size: clamp(26px, 7vw, 48px);
      line-height: 1;
      color: #2f4975;
      letter-spacing: .2px;
    }

    .close {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 2px solid #b9cbea;
      background: linear-gradient(180deg, #ffffff, #dde9fa);
      color: #5573a4;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      background: var(--panel-soft);
      border: 2px solid #c6d7ef;
      border-radius: 999px;
      padding: 0 12px;
      min-width: 0;
    }

    .search-icon {
      width: 16px;
      height: 16px;
      border: 2px solid #7b97c3;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
    }

    .search-icon::after {
      content: '';
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 8px;
      height: 2px;
      border-radius: 2px;
      background: #7b97c3;
      transform: rotate(40deg);
    }

    .search-wrap input {
      border: 0;
      background: transparent;
      width: 100%;
      min-width: 0;
      outline: none;
      font-size: clamp(15px, 3.7vw, 22px);
      color: #37547e;
      font-weight: 700;
    }

    .capacity {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(12px, 2.9vw, 16px);
      font-weight: 800;
      color: #4d6b9b;
      white-space: nowrap;
    }

    .cap-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 2px solid #c1d2ec;
      background: linear-gradient(180deg, #ffffff, #dce8f9);
      color: #5f7ca8;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      border: 2px solid #c2d2ea;
      border-radius: 16px;
      background: #eff5ff;
      padding: 2px;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat {
      border: 0;
      background: transparent;
      color: #4b678f;
      min-width: 98px;
      height: 56px;
      font-size: clamp(13px, 3vw, 16px);
      font-weight: 800;
      display: grid;
      align-items: center;
      justify-items: center;
      border-right: 1px solid #d6e3f5;
      scroll-snap-align: start;
      cursor: pointer;
      flex-shrink: 0;
      padding: 4px 8px;
    }

    .cat:last-child { border-right: 0; }

    .cat .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #90a9cf;
      margin-bottom: 4px;
    }

    .cat.active {
      color: #fff;
      border-radius: 14px;
      border-right-color: transparent;
      background: linear-gradient(180deg, #5db3ff, #2f8de7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    .cat.active .cat-dot { background: #ffffff; }

    .item-grid {
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      align-content: start;
    }

    .item {
      border: 2px solid #cad9ee;
      border-radius: 14px;
      background: linear-gradient(180deg, #fdfefe, #e8f0fc);
      min-height: 98px;
      padding: 6px;
      display: grid;
      grid-template-rows: 1fr auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
      cursor: pointer;
    }

    .item.active {
      border-color: #f4c85a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 2px rgba(245, 195, 70, .24);
      background: linear-gradient(180deg, #fffef7, #edf4ff);
    }

    .item img {
      width: 100%;
      max-width: 64px;
      margin: auto;
      filter: drop-shadow(0 4px 5px rgba(47,85,140,.2));
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: clamp(14px, 3.1vw, 16px);
      font-weight: 900;
      color: #4a678f;
    }

    .qty-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6ea0ff;
      flex: 0 0 auto;
    }

    .details {
      border-top: 2px solid #c8d8f0;
      padding-top: 8px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .selected-icon {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      border: 2px solid #66abf2;
      background: #f6faff;
      padding: 6px;
      display: grid;
      place-items: center;
    }

    .selected-icon img { width: 50px; }

    .meta { min-width: 0; }
    .meta h3 {
      margin: 0;
      font-size: clamp(20px, 5.8vw, 32px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .meta p {
      margin: 6px 0 0;
      font-size: clamp(13px, 3.3vw, 18px);
      color: var(--muted);
      line-height: 1.2;
    }

    .type-tag {
      display: inline-block;
      background: #eaf1ff;
      color: #5f7bb0;
      font-size: clamp(11px, 2.5vw, 14px);
      font-weight: 800;
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      border: 1px solid #c5d8f5;
      vertical-align: middle;
    }

    .stepper-label {
      font-size: 11px;
      color: #6078a4;
      font-weight: 800;
      margin-bottom: 4px;
      text-align: right;
    }

    .stepper {
      display: grid;
      grid-template-columns: 34px 44px 34px;
      gap: 4px;
      align-items: center;
    }

    .stepper button {
      height: 34px;
      border-radius: 11px;
      border: 2px solid #c0cfe8;
      background: linear-gradient(180deg, #fbfdff, #dde8fa);
      color: #4f6998;
      font-size: 26px;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .stepper strong {
      text-align: center;
      font-size: 18px;
      color: #3b5785;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-weight: 900;
      font-size: clamp(13px, 3vw, 18px);
      height: 42px;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0,0,0,.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 3px 7px rgba(34,59,95,.22);
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn.green { background: linear-gradient(180deg,#6ede60,#32bf35); }
    .btn.blue { background: linear-gradient(180deg,#73abff,#4f7cff); }
    .btn.orange { background: linear-gradient(180deg,#ffd166,#f2a727); }
    .btn.red { background: linear-gradient(180deg,#ffa4a4,#e06363); }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
    }

    .small-btn {
      border: 2px solid #becde7;
      background: linear-gradient(180deg,#f8fcff,#dfe9f9);
      border-radius: 12px;
      color: #5b76a2;
      font-size: clamp(12px, 2.7vw, 15px);
      font-weight: 900;
      height: 38px;
      cursor: pointer;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .small-btn.primary {
      background: linear-gradient(180deg,#5fb3ff,#3490e8);
      border-color: #4699eb;
      color: #fff;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(10px);
      background: rgba(30, 61, 110, .92);
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px), (max-height: 760px) {
      .inventory { inset: 6px; padding: 8px; gap: 6px; }
      .header { padding-bottom: 6px; }
      .title { margin-left: 30px; }
      .item-grid { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 5px; }
      .item { min-height: 84px; padding: 4px; }
      .item img { max-width: 52px; }
      .selected-icon { width: 58px; height: 58px; padding: 4px; }
      .selected-icon img { width: 44px; }
      .actions { gap: 5px; }
      .btn { height: 36px; border-radius: 10px; font-size: 12px; }
      .small-btn { height: 34px; font-size: 11px; border-radius: 10px; }
      .categories .cat { min-width: 88px; height: 52px; }
    }

    @media (max-width: 350px) {
      .search-row { grid-template-columns: 1fr; }
      .capacity { justify-content: space-between; width: 100%; }
      .details { grid-template-columns: auto 1fr; }
      .details > :last-child { grid-column: 1 / -1; justify-self: end; }
      .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <main class="phone">
      <section class="inventory">
        <div class="header">
          <div class="title">Инвентарь</div>
          <button class="close" id="closeBtn">×</button>
        </div>

        <div class="search-row">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="searchInput" type="search" placeholder="Поиск по предметам" />
          </label>
          <div class="capacity">Предметов: <span id="capText">0 / 120</span> <button class="cap-btn" id="expandBtn">+</button></div>
        </div>

        <div class="categories" id="categories"></div>

        <div class="item-grid" id="itemGrid"></div>

        <div class="details">
          <div class="selected-icon"><img id="selectedImg" alt="Предмет" /></div>
          <div class="meta">
            <h3 id="selectedName"></h3>
            <p id="selectedDesc"></p>
          </div>
          <div>
            <div class="stepper-label">Количество</div>
            <div class="stepper">
              <button id="minusBtn">−</button>
              <strong id="amountText">1</strong>
              <button id="plusBtn">+</button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn green" id="useBtn">Использовать</button>
          <button class="btn blue" id="splitBtn">Разделить</button>
          <button class="btn orange" id="craftBtn">В крафт</button>
          <button class="btn red" id="dropBtn">Выбросить</button>
        </div>

        <div class="footer-actions">
          <button class="small-btn primary" id="sellBtn">Продать</button>
          <button class="small-btn" id="sortBtn">Сортировка</button>
          <button class="small-btn" id="filterBtn">Фильтр</button>
          <button class="small-btn" id="settingsBtn">Параметры</button>
        </div>
      </section>
      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script>
    const categories = [
      { key: 'all', label: 'Все' },
      { key: 'resources', label: 'Ресурсы' },
      { key: 'consumables', label: 'Расходники' },
      { key: 'materials', label: 'Материалы' },
      { key: 'food', label: 'Еда' },
      { key: 'craft', label: 'Крафт' },
      { key: 'keys', label: 'Ключи' }
    ];

    const items = [
      { id:'pokeball',name:'Покебол',cat:'consumables',count:18,tag:'Ключевой предмет',desc:'Позволяет ловить монстров.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png' },
      { id:'greatball',name:'Грейтбол',cat:'consumables',count:9,tag:'Расходник',desc:'Повышенный шанс поимки.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/great-ball.png' },
      { id:'ultraball',name:'Ультрабол',cat:'consumables',count:4,tag:'Расходник',desc:'Для редких покемонов.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ultra-ball.png' },
      { id:'masterball',name:'Мастербол',cat:'keys',count:1,tag:'Легендарный',desc:'Ловит покемона без промаха.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png' },
      { id:'potion',name:'Поушен',cat:'consumables',count:15,tag:'Лечение',desc:'Восстанавливает 20 HP.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/potion.png' },
      { id:'super-potion',name:'Супер Поушен',cat:'consumables',count:6,tag:'Лечение',desc:'Восстанавливает 60 HP.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/super-potion.png' },
      { id:'revive',name:'Ревайв',cat:'consumables',count:3,tag:'Поддержка',desc:'Поднимает покемона после нокаута.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/revive.png' },
      { id:'razz',name:'Разз Берри',cat:'food',count:22,tag:'Еда',desc:'Слаще, чем обычная ягода.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/razz-berry.png' },
      { id:'oran',name:'Оран Берри',cat:'food',count:17,tag:'Еда',desc:'Немного лечит в бою.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/oran-berry.png' },
      { id:'pecha',name:'Пича Берри',cat:'food',count:12,tag:'Еда',desc:'Лечит отравление.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/pecha-berry.png' },
      { id:'leaf-stone',name:'Листовой камень',cat:'materials',count:5,tag:'Эволюция',desc:'Эволюционный камень травы.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/leaf-stone.png' },
      { id:'fire-stone',name:'Огненный камень',cat:'materials',count:4,tag:'Эволюция',desc:'Эволюционный камень огня.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/fire-stone.png' },
      { id:'water-stone',name:'Водный камень',cat:'materials',count:4,tag:'Эволюция',desc:'Эволюционный камень воды.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/water-stone.png' },
      { id:'thunder-stone',name:'Громовой камень',cat:'materials',count:3,tag:'Эволюция',desc:'Эволюционный камень молнии.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/thunder-stone.png' },
      { id:'moon-stone',name:'Лунный камень',cat:'materials',count:2,tag:'Эволюция',desc:'Для редких эволюций.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/moon-stone.png' },
      { id:'star-piece',name:'Звёздный осколок',cat:'resources',count:11,tag:'Ресурс',desc:'Сверкающий ресурс для обмена.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/star-piece.png' },
      { id:'stardust',name:'Стардаст',cat:'resources',count:35,tag:'Ресурс',desc:'Пыль для усиления покемонов.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/stardust.png' },
      { id:'honey',name:'Мёд',cat:'food',count:8,tag:'Еда',desc:'Приманивает диких покемонов.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/honey.png' },
      { id:'silver-powder',name:'Серебряная пыль',cat:'materials',count:14,tag:'Материал',desc:'Редкий порошок насекомых.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/silver-powder.png' },
      { id:'charcoal',name:'Уголь',cat:'materials',count:9,tag:'Материал',desc:'Усиливает огненные атаки.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/charcoal.png' },
      { id:'mystic-water',name:'Мистическая вода',cat:'materials',count:13,tag:'Материал',desc:'Усиливает водные атаки.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/mystic-water.png' },
      { id:'dragon-fang',name:'Клык дракона',cat:'materials',count:5,tag:'Материал',desc:'Редкий драконий трофей.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dragon-fang.png' },
      { id:'rare-candy',name:'Редкая конфета',cat:'consumables',count:7,tag:'Прокачка',desc:'Повышает уровень на 1.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/rare-candy.png' },
      { id:'escape-rope',name:'Канат побега',cat:'craft',count:10,tag:'Утилита',desc:'Мгновенно покинуть пещеру.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/escape-rope.png' },
      { id:'old-amber',name:'Старый янтарь',cat:'keys',count:1,tag:'Ключевой',desc:'Ископаемый артефакт.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/old-amber.png' },
      { id:'dome-fossil',name:'Купольный ископаемый',cat:'keys',count:1,tag:'Ключевой',desc:'Материал для воскрешения.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dome-fossil.png' },
      { id:'helix-fossil',name:'Спиральный ископаемый',cat:'keys',count:1,tag:'Ключевой',desc:'Материал для воскрешения.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/helix-fossil.png' },
      { id:'soft-sand',name:'Мягкий песок',cat:'resources',count:19,tag:'Ресурс',desc:'Сырьё для крафта.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/soft-sand.png' },
      { id:'hard-stone',name:'Крепкий камень',cat:'resources',count:16,tag:'Ресурс',desc:'Сырьё для апгрейдов.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/hard-stone.png' },
      { id:'tiny-mushroom',name:'Маленький гриб',cat:'food',count:20,tag:'Еда',desc:'Ингредиент для блюд.',img:'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/tiny-mushroom.png' }
    ];

    const state = {
      category: 'all',
      search: '',
      selectedId: items[0].id,
      amount: 1,
      maxCapacity: 120
    };

    const el = {
      categories: document.getElementById('categories'),
      searchInput: document.getElementById('searchInput'),
      itemGrid: document.getElementById('itemGrid'),
      selectedImg: document.getElementById('selectedImg'),
      selectedName: document.getElementById('selectedName'),
      selectedDesc: document.getElementById('selectedDesc'),
      amountText: document.getElementById('amountText'),
      capText: document.getElementById('capText'),
      toast: document.getElementById('toast')
    };

    const getSelected = () => items.find(x => x.id === state.selectedId) || items[0];

    const filtered = () => items.filter(item => {
      const categoryMatch = state.category === 'all' || item.cat === state.category;
      const searchMatch = (item.name + ' ' + item.tag + ' ' + item.desc).toLowerCase().includes(state.search.toLowerCase());
      return categoryMatch && searchMatch;
    });

    function showToast(text) {
      el.toast.textContent = text;
      el.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 1600);
    }

    function renderCategories() {
      el.categories.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat ${cat.key === state.category ? 'active' : ''}`;
        btn.innerHTML = `<span class="cat-dot" aria-hidden="true"></span><span>${cat.label}</span>`;
        btn.onclick = () => {
          state.category = cat.key;
          render();
        };
        el.categories.append(btn);
      });
    }

    function renderItems() {
      const list = filtered();
      el.itemGrid.innerHTML = '';
      if (!list.length) {
        el.itemGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#6782ab;font-weight:800">Ничего не найдено. Попробуйте другой запрос.</div>';
        return;
      }

      if (!list.some(i => i.id === state.selectedId)) state.selectedId = list[0].id;

      list.forEach(item => {
        const card = document.createElement('button');
        card.className = `item ${item.id === state.selectedId ? 'active' : ''}`;
        card.innerHTML = `<img src="${item.img}" alt="${item.name}" /><div class="qty"><span class="qty-dot" aria-hidden="true"></span>x${item.count}</div>`;
        card.onclick = () => {
          state.selectedId = item.id;
          state.amount = 1;
          render();
        };
        el.itemGrid.append(card);
      });
    }

    function renderDetails() {
      const item = getSelected();
      el.selectedImg.src = item.img;
      el.selectedName.innerHTML = `${item.name} <span class="type-tag">${item.tag}</span>`;
      el.selectedDesc.textContent = item.desc;
      el.amountText.textContent = state.amount;
      el.capText.textContent = `${items.reduce((sum, i) => sum + i.count, 0)} / ${state.maxCapacity}`;
    }

    function updateAmount(delta) {
      const item = getSelected();
      state.amount = Math.max(1, Math.min(item.count, state.amount + delta));
      renderDetails();
    }

    function action(type) {
      const item = getSelected();
      if (!item) return;
      if ((type === 'use' || type === 'drop' || type === 'sell' || type === 'split') && item.count < state.amount) {
        showToast('Недостаточно предметов.');
        return;
      }
      if (type === 'use') {
        item.count -= state.amount;
        showToast(`Использовано: ${item.name} ×${state.amount}`);
      }
      if (type === 'drop') {
        item.count -= state.amount;
        showToast(`Выброшено: ${item.name} ×${state.amount}`);
      }
      if (type === 'sell') {
        item.count -= state.amount;
        showToast(`Продано: ${item.name} ×${state.amount}`);
      }
      if (type === 'split') {
        showToast(`Разделено: ${item.name} ×${state.amount}`);
      }
      if (type === 'craft') {
        showToast(`${item.name} отправлен в крафт.`);
      }
      item.count = Math.max(0, item.count);
      state.amount = 1;
      render();
    }

    function render() {
      renderCategories();
      renderItems();
      renderDetails();
    }

    document.getElementById('plusBtn').onclick = () => updateAmount(1);
    document.getElementById('minusBtn').onclick = () => updateAmount(-1);

    el.searchInput.addEventListener('input', e => {
      state.search = e.target.value.trim();
      render();
    });

    document.getElementById('expandBtn').onclick = () => {
      state.maxCapacity += 20;
      showToast('Куплено +20 ячеек инвентаря.');
      renderDetails();
    };

    document.getElementById('useBtn').onclick = () => action('use');
    document.getElementById('dropBtn').onclick = () => action('drop');
    document.getElementById('sellBtn').onclick = () => action('sell');
    document.getElementById('splitBtn').onclick = () => action('split');
    document.getElementById('craftBtn').onclick = () => action('craft');
    document.getElementById('sortBtn').onclick = () => {
      items.sort((a, b) => b.count - a.count);
      showToast('Сортировка: сначала самые большие стаки.');
      render();
    };
    document.getElementById('filterBtn').onclick = () => {
      state.search = 'камень';
      el.searchInput.value = state.search;
      showToast('Быстрый фильтр: камни.');
      render();
    };
    document.getElementById('settingsBtn').onclick = () => showToast('Настройки инвентаря (демо).');
    document.getElementById('closeBtn').onclick = () => showToast('Окно инвентаря нельзя закрыть в демо.');

    render();
  </script>
</body>
</html>
